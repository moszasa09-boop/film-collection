<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>คอร์ดเลื่อนตามเพลง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one reading column. A fixed playhead sits at 34% of the screen; the sheet holds still and
   steps up one line at a time, timed by the song's BPM. Chords stay blue like the original sheet;
   amber marks "now". */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --fg: #151922;
  --muted: #5b6474;
  --rule: #dde2ea;
  --chord: #1f54d6;
  --now: #d97706;
  --on-now: #1b1203;
  --now-bg: rgba(217, 119, 6, .11);
  --instru-bg: #e9eef6;
  --shadow: 0 -6px 24px rgba(20, 30, 50, .10);
  --f-display: "Chakra Petch", "Anuphan", system-ui, sans-serif;
  --f-body: "Anuphan", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --f-chord: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --scale: 1;
  --guide: 34vh;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161b25; --fg: #e8ebf1; --muted: #8d96a8; --rule: #262d3a;
    --chord: #7fb0ff; --now: #ffb547; --now-bg: rgba(255, 181, 71, .12); --instru-bg: #1a2130;
    --shadow: 0 -6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b25; --fg: #e8ebf1; --muted: #8d96a8; --rule: #262d3a;
  --chord: #7fb0ff; --now: #ffb547; --now-bg: rgba(255, 181, 71, .12); --instru-bg: #1a2130;
  --shadow: 0 -6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.icon-btn {
  display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 10px; background: transparent; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 15px; text-decoration: none; color: inherit;
}
.icon-btn:hover { border-color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- home ---------- */
.home-head { padding-block: 28px 8px; display: grid; gap: 6px; }
.home-head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 6vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.home-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.how { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-block: 10px 18px; color: var(--muted); font-size: 14px; }
.how b { color: var(--fg); font-weight: 600; }
.list { display: grid; padding-block: 0 48px; border-top: 1px solid var(--rule); }
.song-row { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.song-row:hover .t { color: var(--chord); }
.song-row .n { font-family: var(--f-chord); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.song-row .t { font-size: 18px; font-weight: 600; line-height: 1.3; min-width: 0; }
.song-row .a { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
.song-row .k { display: grid; justify-items: end; gap: 2px; }
.keychip { font-family: var(--f-chord); font-weight: 600; font-size: 13px; color: var(--chord); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.bpmtxt { font-family: var(--f-chord); font-size: 11px; color: var(--muted); }

/* ---------- song ---------- */
.song-head { padding-block: 22px 18px; display: grid; gap: 4px; min-height: calc(var(--guide) - 56px); align-content: end; }
.song-head h1 { font-family: var(--f-display); font-weight: 700; font-size: calc(30px * var(--scale)); line-height: 1.15; margin: 0; text-wrap: balance; }
.song-head .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; }
.song-head .meta b { font-family: var(--f-chord); color: var(--chord); font-weight: 600; }
.sheet { display: grid; gap: calc(26px * var(--scale)); padding-bottom: 75vh; font-size: calc(21px * var(--scale)); }
.stanza { display: grid; gap: calc(4px * var(--scale)); }

.sec {
  font-family: var(--f-display); font-weight: 600; font-size: .62em; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 10px;
}
.sec::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.sec.on { color: var(--now); }

.line { position: relative; border-radius: 8px; padding: 2px 10px 6px; margin: 0 -10px; cursor: pointer; transition: opacity .3s, background-color .3s; }
.line::before { content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--now); opacity: 0; transition: opacity .2s; }
.line::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px;
  background: var(--now); opacity: 0; transform-origin: left; transform: scaleX(var(--p, 0));
}
.line.past { opacity: .32; }
.line.now { background: var(--now-bg); }
.line.now::before { opacity: 1; }
.playing .line.now::after { opacity: .7; }

.lyr { display: flex; flex-wrap: wrap; align-items: flex-start; }
.seg { display: inline-flex; flex-direction: column; max-width: 100%; }
.ch { font-family: var(--f-chord); font-weight: 600; color: var(--chord); font-size: .86em; line-height: 1.25; padding-right: .55em; white-space: nowrap; min-height: 1.25em; }
.ly { white-space: pre-wrap; line-height: 1.55; }
.lyr.nochord .ch { display: none; }
.lyr.onlychord .ly { display: none; }
.lyr.onlychord .ch { font-size: .95em; padding-right: 1.1em; }

.instru { background: var(--instru-bg); padding: 10px 12px 12px; margin: 0 -10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.instru .lab { font-family: var(--f-display); font-weight: 600; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.instru.now .lab { color: var(--now); }
.bars { display: flex; flex-wrap: wrap; align-items: center; }
.bars span { font-family: var(--f-chord); font-weight: 600; color: var(--chord); font-size: .9em; padding: 0 .55em; border-left: 2px solid var(--rule); line-height: 1.5; }
.bars span:last-child { border-right: 2px solid var(--rule); }
.instru .note { color: var(--muted); font-size: .72em; }
.line.notel { color: var(--muted); font-style: italic; font-size: .85em; }
.line.endl { color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: .8em; letter-spacing: .06em; text-align: center; padding-block: 10px; }

.next-song { padding-block: 0 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.next-song a { color: var(--chord); text-decoration: none; font-weight: 600; }

.guide { position: fixed; top: var(--guide); left: 0; right: 0; height: 0; pointer-events: none; z-index: 5; }
.guide::before, .guide::after { content: ""; position: absolute; top: -7px; border: 7px solid transparent; }
.guide::before { left: max(0px, env(safe-area-inset-left, 0px)); border-left-color: var(--now); }
.guide::after { right: max(0px, env(safe-area-inset-right, 0px)); border-right-color: var(--now); }

/* ---------- player ---------- */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player .wrap { display: grid; gap: 6px; padding-block: 10px 10px; }
.status { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.status .now-sec { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--now); white-space: nowrap; }
.status .next-sec { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .next-sec b { color: var(--fg); font-weight: 600; }
.beats { display: flex; gap: 5px; align-self: center; }
.beats i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.beats i.on { background: var(--now); }
.beats i.on:first-child { box-shadow: 0 0 0 3px var(--now-bg); }
.prog { display: flex; align-items: center; gap: 10px; font-family: var(--f-chord); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog input { flex: 1; min-width: 0; accent-color: var(--now); height: 22px; cursor: pointer; }
.ctrls { display: flex; align-items: flex-end; gap: 8px; justify-content: space-between; }
.play { width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; background: var(--now); color: var(--on-now); display: grid; place-items: center; flex: none; }
.play svg { width: 26px; height: 26px; }
.play:active { transform: scale(.96); }
.stepper { display: grid; grid-template-columns: 36px auto 36px; align-items: center; gap: 2px; text-align: center; }
.cap { font-size: 11px; letter-spacing: .06em; color: var(--muted); font-family: var(--f-display); font-weight: 600; text-transform: uppercase; text-align: center; }
.stepper .cap { grid-column: 1 / -1; }
.stepper button, .tap { height: 38px; border: 1px solid var(--rule); background: transparent; border-radius: 9px; cursor: pointer; font-size: 20px; line-height: 1; }
.stepper button:hover, .tap:hover { border-color: var(--muted); }
.stepper .val { min-width: 3em; font-family: var(--f-chord); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.stepper .val.key { color: var(--chord); }
.tapwrap { display: grid; gap: 2px; }
.tap { font-family: var(--f-display); font-weight: 600; font-size: 14px; padding: 0 12px; }
.tap.hit { border-color: var(--now); color: var(--now); }
.countin { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 25; font-family: var(--f-display); font-weight: 700; font-size: 34vmin; color: var(--now); opacity: .9; }

@media (max-width: 420px) {
  .ctrls { gap: 5px; }
  .stepper { grid-template-columns: 32px auto 32px; }
  .stepper .val { min-width: 2.6em; font-size: 14px; }
  .tap { padding: 0 8px; font-size: 13px; }
  .play { width: 52px; height: 52px; }
  .status .now-sec { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { .line, .line::before { transition: none; } }
</style>

/* ---------- chords ---------- */
const NOTES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
const IDX = { C: 0, "B#": 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, Fb: 4, F: 5, "E#": 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11, Cb: 11 };
function tr(ch, s) {
  if (!s || !ch) return ch;
  return ch.replace(/(^|[\/(\s|])([A-G](?:#|b)?)/g, (m, pre, root) => IDX[root] == null ? m : pre + NOTES[(IDX[root] + s + 120) % 12]);
}
function firstChord(song) {
  for (const b of song.blocks) {
    if (b.type === "instru" && b.bars && b.bars.length) return b.bars[0];
    if (b.type === "lines") for (const l of b.lines) for (const [c] of l) if (c) return c;
  }
  return "";
}
function keyOf(song, s) {
  const m = /^\(?([A-G](?:#|b)?)(m(?!aj))?/.exec(firstChord(song) || "");
  return m ? tr(m[1], s) + (m[2] ? "m" : "") : "";
}
const songBpm = song => store.get("bpm:" + song.id, song.bpm || 80);

/* ---------- sections & timing ----------
   Each playable row gets a length in bars (4/4):
   - lyric line: 2 bars, or half its chord count if it has more than 4 chords
   - chord-only line: one bar per chord
   - INTRO / INSTRU box: its bars, times the "( n Times )" note
   Section names: a stanza starting with "**" is the hook (and "*" is then the pre-hook);
   if the song only uses "*", that is the hook. Other stanzas are verses. */
const HEADER_RE = /^(verse|hook|chorus|bridge|pre|ending|outro|intro|key|solo|ท่อน)/i;
function analyse(song) {
  const starts = b => { const t = (b.lines[0] || []).map(s => s[1] || "").join("").trim(); return t.startsWith("**") ? 2 : t.startsWith("*") ? 1 : 0; };
  // "( ซ้ำ * , ** )" → write the repeated stanzas out again, so the timeline follows the real song
  const blocks = [];
  song.blocks.forEach(b => {
    if (b.type === "note" && /ซ้ำ/.test(b.text) && /\*/.test(b.text)) {
      const marks = (b.text.match(/\*+/g) || []).map(m => m.length);
      const copies = marks.map(n => blocks.find(x => x.type === "lines" && starts(x) === n)).filter(Boolean);
      if (copies.length === marks.length) { copies.forEach(c => blocks.push({ ...c, repeat: true })); return; }
    }
    blocks.push(b);
  });
  const usesDouble = blocks.some(b => b.type === "lines" && starts(b) === 2);
  const lastInstru = blocks.map(b => b.type).lastIndexOf("instru");
  const firstLines = blocks.findIndex(b => b.type === "lines");
  const out = [];
  let pendingHeader = null, prevInstruName = null;
  blocks.forEach((b, i) => {
    if (b.type === "note" && HEADER_RE.test(b.text.trim()) && !/ซ้ำ/.test(b.text)) { pendingHeader = b.text.trim(); return; }
    if (b.type === "instru") {
      let name;
      if (!b.label && prevInstruName) name = prevInstruName;
      else if (i < firstLines || /intro/i.test(b.label)) name = "อินโทร";
      else if (i === lastInstru && blocks.slice(i + 1).every(x => x.type !== "lines")) name = "เอาท์โทร";
      else name = "ดนตรี";
      if (pendingHeader) { name = pendingHeader; pendingHeader = null; }
      prevInstruName = name;
      const m = /(\d+)\s*(times|ครั้ง|รอบ)|x\s*(\d+)/i.exec(b.note || "");
      const times = m ? +(m[1] || m[3]) : 1;
      out.push({ kind: "instru", block: b, name, bars: Math.max(2, (b.bars || []).length * times) });
      return;
    }
    prevInstruName = null;
    if (b.type === "lines") {
      const st = starts(b);
      let name = st === 2 ? "ฮุค" : st === 1 ? (usesDouble ? "พรีฮุค" : "ฮุค") : "เวิร์ส";
      if (pendingHeader) { name = pendingHeader; pendingHeader = null; }
      out.push({ kind: "lines", block: b, name, lines: b.lines.map(l => {
        const n = l.filter(([c]) => c).length;
        const hasText = l.some(([, t]) => t && t.trim());
        return { line: l, bars: !hasText ? Math.max(1, n) : n > 4 ? Math.ceil(n / 2) : 2 };
      }) });
      return;
    }
    out.push({ kind: b.type, block: b, name: null, bars: 0 });
  });
  // number repeated verse labels: เวิร์ส 1, เวิร์ส 2 …
  let v = 0; out.forEach(o => { if (o.kind === "lines" && o.name === "เวิร์ส") o.name = "เวิร์ส " + (++v); });
  out.forEach(o => { if (o.block.repeat) o.name += " (ซ้ำ)"; });
  return out;
}

function segHTML(line, s, attrs) {
  const hasChord = line.some(([c]) => c);
  const hasText = line.some(([, t]) => t && t.trim());
  const cls = !hasChord ? "nochord" : !hasText ? "onlychord" : "";
  return `<div class="line lyr ${cls}" ${attrs}>` + line.map(([c, t]) =>
    `<span class="seg"><span class="ch">${c ? esc(tr(c, s)) : "&nbsp;"}</span><span class="ly">${esc(t || "")}</span></span>`
  ).join("") + `</div>`;
}

function sheetHTML(s) {
  return parts.map((p, pi) => {
    const b = p.block;
    if (p.kind === "instru") return `<div class="line instru" data-p="${pi}" data-bars="${p.bars}"><span class="lab">${esc(p.name)}</span><span class="bars">${(b.bars || []).map(c => `<span>${esc(tr(c, s))}</span>`).join("")}</span>${b.note ? `<span class="note">${esc(b.note)}</span>` : ""}</div>`;
    if (p.kind === "lines") return `<div class="stanza"><div class="sec" data-sec="${pi}">${esc(p.name)}</div>${p.lines.map(l => segHTML(l.line, s, `data-p="${pi}" data-bars="${l.bars}"`)).join("")}</div>`;
    if (p.kind === "note") return `<div class="line notel" data-p="${pi}" data-bars="0">${esc(b.text)}</div>`;
    if (p.kind === "end") return `<div class="line endl" data-p="${pi}" data-bars="0">${esc(b.text)}</div>`;
    return "";
  }).join("");
}

    <div class="next-song">
      ${prev ? `<a href="#song-${i}">‹ ${esc(prev.title)}</a>` : "<span></span>"}
      ${next ? `<a href="#song-${i + 2}">${esc(next.title)} ›</a>` : ""}
    </div>
  </main>
  <div style="height:190px"></div>
  <section class="player" aria-label="ตัวควบคุมการเล่น"><div class="wrap">
    <div class="status" aria-live="polite">
      <span class="now-sec" id="now-sec"></span>
      <span class="next-sec" id="next-sec"></span>
      <span class="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="prog">
      <span id="t-now">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="ตำแหน่งในเพลง">
      <span id="t-all">0:00</span>
    </div>
    <div class="ctrls">
      <button class="play" id="play" aria-label="เล่น">${I.play}</button>
      <div class="stepper" role="group" aria-label="ความเร็วเพลง">
        <span class="cap">BPM</span>
        <button id="bpm-down" aria-label="ช้าลง">−</button><span class="val" id="bpm">${bpm}</span><button id="bpm-up" aria-label="เร็วขึ้น">+</button>
      </div>
      <div class="tapwrap"><span class="cap">จับจังหวะ</span><button class="tap" id="tap">แตะตาม</button></div>
      <div class="stepper" role="group" aria-label="เปลี่ยนคีย์">
        <span class="cap">คีย์</span>
        <button id="tr-down" aria-label="ลดคีย์ครึ่งเสียง">−</button><span class="val key" id="tr">${shiftLabel()}</span><button id="tr-up" aria-label="เพิ่มคีย์ครึ่งเสียง">+</button>
      </div>
    </div>
  </div></section>`;

  $("play").onclick = toggle;
  $("bpm-down").onclick = () => setBpm(bpm - 2);
  $("bpm-up").onclick = () => setBpm(bpm + 2);
  $("tap").onclick = tapTempo;
  $("tr-down").onclick = () => setShift(shift - 1);
  $("tr-up").onclick = () => setShift(shift + 1);
  $("fs-down").onclick = () => setFont(fontScale - .1);
  $("fs-up").onclick = () => setFont(fontScale + .1);
  const seek = $("seek");
  seek.addEventListener("input", () => { dragging = true; seekTo(total * seek.value / 1000, false); });
  seek.addEventListener("change", () => { dragging = false; });
  $("sheet").addEventListener("click", e => {
    const ln = e.target.closest(".line"); if (!ln) return;
    const k = rows.indexOf(ln); if (k < 0) return;
    cur = k; elapsed = 0; countBeats = 0; scrollToRow(k); paint();
  });
  if (changed) window.scrollTo(0, 0);
  paintedCur = paintedSec = -1;
  measure();
  if (cur > 0) scrollToRow(cur, true);
}

function shiftLabel() { return shift === 0 ? "เดิม" : (shift > 0 ? "+" : "") + shift; }

/* ---------- timeline ---------- */
function measure() {
  rows = Array.from(document.querySelectorAll("#sheet .line"));
  tops = rows.map(el => el.getBoundingClientRect().top + window.scrollY);
  retime();
}
function retime() {
  starts = []; let t = 0;
  rows.forEach(el => { starts.push(t); t += (+el.dataset.bars) * secPerBar(); });
  total = t;
  const all = $("t-all"); if (all) all.textContent = fmt(total);
  const len = $("len"); if (len) len.textContent = "ยาวประมาณ " + fmt(total);
  paint();
}
const rowDur = k => rows[k] ? (+rows[k].dataset.bars) * secPerBar() : 0;
function rowAtScroll() {
  const y = window.scrollY + guideY() + 6;
  let lo = 0, hi = tops.length - 1, k = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (tops[m] <= y) { k = m; lo = m + 1; } else hi = m - 1; }
  return k;
}
function scrollToRow(k, instant) {
  if (!rows[k]) return;
  autoScrollUntil = performance.now() + 900;
  window.scrollTo({ top: Math.max(0, tops[k] - guideY() + 2), behavior: instant || reduceMotion() ? "auto" : "smooth" });
}
function seekTo(t, smooth) {
  let k = 0; while (k < rows.length - 1 && starts[k + 1] <= t) k++;
  cur = k; elapsed = Math.max(0, t - starts[k]); countBeats = 0;
  scrollToRow(k, !smooth); paint();
}

/* ---------- painting ---------- */
let paintedCur = -1, paintedSec = -1;
function sectionOf(k) { return rows[k] ? +rows[k].dataset.p : -1; }
function nextSectionName(k) {
  const p = sectionOf(k);
  for (let j = k + 1; j < rows.length; j++) {
    const q = sectionOf(j);
    if (q !== p && parts[q].name) return parts[q].name;
  }
  return "";
}
function paint() {
  if (view == null || !rows.length) return;
  if (cur !== paintedCur) {
    rows.forEach((el, j) => { el.classList.toggle("now", j === cur); el.classList.toggle("past", j < cur); el.style.removeProperty("--p"); });
    paintedCur = cur;
  }
  const p = sectionOf(cur);
  if (p !== paintedSec) {
    document.querySelectorAll(".sec.on").forEach(e => e.classList.remove("on"));
    const s = document.querySelector(`.sec[data-sec="${p}"]`); if (s) s.classList.add("on");
    const name = parts[p] && parts[p].name;
    $("now-sec").textContent = name || "";
    const nx = nextSectionName(cur);
    $("next-sec").innerHTML = nx ? `ต่อไป <b>${esc(nx)}</b>` : "ท่อนสุดท้าย";
    paintedSec = p;
  }
  const d = rowDur(cur);
  rows[cur].style.setProperty("--p", d ? Math.min(1, elapsed / d) : 0);
  const t = (starts[cur] || 0) + (countBeats > 0 ? 0 : elapsed);
  $("t-now").textContent = fmt(t);
  if (!dragging) $("seek").value = total ? Math.round(t / total * 1000) : 0;
  const beat = !playing ? -1 : countBeats > 0 ? 4 - countBeats : Math.floor(t / (60 / bpm)) % 4;
  document.querySelectorAll(".beats i").forEach((e, j) => e.classList.toggle("on", j === beat));
}

/* ---------- playback ---------- */
function setPlayIcon() {
  const b = $("play"); if (!b) return;
  b.innerHTML = playing ? I.pause : I.play;
  b.setAttribute("aria-label", playing ? "หยุด" : "เล่น");
  document.body.classList.toggle("playing", playing);
}
async function lockScreen() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; } }
function releaseScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
function showCount(n) {
  let el = document.querySelector(".countin");
  if (!n) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.className = "countin"; el.setAttribute("aria-hidden", "true"); document.body.appendChild(el); }
  el.textContent = n;
}

let countStart = 0;
function play() {
  if (view == null || !rows.length) return;
  if (cur >= rows.length - 1 && elapsed >= rowDur(cur)) { cur = 0; elapsed = 0; }
  scrollToRow(cur);
  // one bar of count-in (1 2 3 4) when starting at the top of a line
  countBeats = elapsed === 0 ? 4 : 0; countStart = 0;
  playing = true; lastT = performance.now();
  setPlayIcon(); lockScreen(); paint();
}
function stop() { playing = false; countBeats = 0; showCount(0); setPlayIcon(); releaseScreen(); }
function toggle() { playing ? stop() : play(); }

function setBpm(v) {
  bpm = Math.min(220, Math.max(40, Math.round(v)));
  const el = $("bpm"); if (el) el.textContent = bpm;
  if (view != null) { store.set("bpm:" + SONGS[view].id, bpm); retime(); }
}
function tapTempo() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now); if (taps.length > 6) taps.shift();
  const b = $("tap"); b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 120);
  if (taps.length >= 3) {
    const gaps = taps.slice(1).map((t, j) => t - taps[j]);
    setBpm(60000 / (gaps.reduce((a, c) => a + c, 0) / gaps.length));
  }
}
function setShift(v) {
  shift = ((v + 6 + 120) % 12) - 6;
  if (view == null) return;
  store.set("shift:" + SONGS[view].id, shift);
  $("sheet").innerHTML = sheetHTML(shift);
  $("tr").textContent = shiftLabel();
  $("keyname").textContent = keyOf(SONGS[view], shift);
  paintedCur = paintedSec = -1; measure(); scrollToRow(cur, true);
}
function setFont(v) {
  fontScale = Math.round(Math.min(1.8, Math.max(.7, v)) * 10) / 10;
  store.set("font", fontScale);
  document.documentElement.style.setProperty("--scale", fontScale);
  measure(); scrollToRow(cur, true);
}

function frame(t) {
  const dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
  if (playing && view != null && !userScrolling && rows.length) {
    if (countBeats > 0) {
      countStart += dt;
      const left = 4 - Math.floor(countStart / (60 / bpm));
      if (left <= 0) { countBeats = 0; showCount(0); }
      else { countBeats = left; showCount(5 - left); }
    } else {
      elapsed += dt;
      while (elapsed >= rowDur(cur)) {
        if (cur >= rows.length - 1) { elapsed = rowDur(cur); stop(); break; }
        elapsed -= rowDur(cur); cur++;
        scrollToRow(cur);
      }
    }
    paint();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// When you scroll by hand, the clock waits; when you let go, it carries on from the line at the playhead.
function userScrollStart() { if (view == null) return; userScrolling = true; clearTimeout(userTimer); }
function userScrollEnd(delay) {
  clearTimeout(userTimer);
  userTimer = setTimeout(() => {
    userScrolling = false;
    if (view == null) return;
    const k = rowAtScroll();
    if (k !== cur) { cur = k; elapsed = 0; }
    lastT = performance.now(); paint();
  }, delay);
}
window.addEventListener("touchstart", e => { if (!e.target.closest(".player, .bar")) userScrollStart(); }, { passive: true });
window.addEventListener("touchend", () => { if (userScrolling) userScrollEnd(900); }, { passive: true });
window.addEventListener("wheel", () => { userScrollStart(); userScrollEnd(500); }, { passive: true });
window.addEventListener("scroll", () => {
  if (view == null || playing || performance.now() < autoScrollUntil) return;
  const k = rowAtScroll(); if (k !== cur) { cur = k; elapsed = 0; paint(); }
}, { passive: true });
window.addEventListener("resize", () => { if (view != null) { measure(); scrollToRow(cur, true); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && playing) lockScreen(); });
document.addEventListener("keydown", e => {
  if (view == null || e.target.closest("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); cur = Math.min(rows.length - 1, cur + 1); elapsed = 0; scrollToRow(cur); paint(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); cur = Math.max(0, cur - 1); elapsed = 0; scrollToRow(cur); paint(); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (view != null) { measure(); scrollToRow(cur, true); } });

function route() {
  const m = /^#song-(\d+)$/.exec(location.hash);
  const i = m ? +m[1] - 1 : -1;
  if (i >= 0 && i < SONGS.length) renderSong(i); else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
