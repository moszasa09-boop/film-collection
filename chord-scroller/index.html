<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>คอร์ดเลื่อนตามเพลง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ชีทคอร์ดสำหรับวงดนตรี จัดงานและเซ็ตลิสต์ เล่นแบบเลื่อนตามจังหวะ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one reading column for lists and the player; sheets/dialogs slide over it.
   In the player a fixed playhead sits at 34% of the screen and the song steps up one line at a time.
   Chords stay blue like the original sheets; amber marks "now"; green/red only for status. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --fg: #151922;
  --muted: #5b6474;
  --rule: #dde2ea;
  --chord: #1f54d6;
  --now: #d97706;
  --on-now: #1b1203;
  --now-bg: rgba(217, 119, 6, .11);
  --instru-bg: #e9eef6;
  --ok: #157f3b;
  --ok-bg: rgba(21, 127, 59, .10);
  --warn: #a15c00;
  --warn-bg: rgba(217, 119, 6, .14);
  --bad: #c0262d;
  --bad-bg: rgba(192, 38, 45, .10);
  --scrim: rgba(12, 16, 24, .45);
  --shadow: 0 -6px 24px rgba(20, 30, 50, .10);
  --shadow-pop: 0 12px 40px rgba(20, 30, 50, .22);
  --f-display: "Chakra Petch", "Anuphan", system-ui, sans-serif;
  --f-body: "Anuphan", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --f-chord: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --scale: 1;
  --guide: 34vh;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161b25; --surface-2: #1c2230; --fg: #e8ebf1; --muted: #8d96a8; --rule: #262d3a;
    --chord: #7fb0ff; --now: #ffb547; --now-bg: rgba(255, 181, 71, .12); --instru-bg: #1a2130;
    --ok: #5fd08a; --ok-bg: rgba(95, 208, 138, .12); --warn: #ffc56b; --warn-bg: rgba(255, 181, 71, .14);
    --bad: #ff7a7f; --bad-bg: rgba(255, 122, 127, .12); --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 -6px 24px rgba(0, 0, 0, .45); --shadow-pop: 0 12px 40px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b25; --surface-2: #1c2230; --fg: #e8ebf1; --muted: #8d96a8; --rule: #262d3a;
  --chord: #7fb0ff; --now: #ffb547; --now-bg: rgba(255, 181, 71, .12); --instru-bg: #1a2130;
  --ok: #5fd08a; --ok-bg: rgba(95, 208, 138, .12); --warn: #ffc56b; --warn-bg: rgba(255, 181, 71, .14);
  --bad: #ff7a7f; --bad-bg: rgba(255, 122, 127, .12); --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 -6px 24px rgba(0, 0, 0, .45); --shadow-pop: 0 12px 40px rgba(0, 0, 0, .6); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
a { color: var(--chord); }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 8px; min-height: 54px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.icon-btn {
  display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 10px; flex: none;
  border: 1px solid var(--rule); border-radius: 10px; background: transparent; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 15px; text-decoration: none; color: inherit;
}
.icon-btn:hover { border-color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="true"] { background: var(--now-bg); border-color: var(--now); color: var(--now); }

.tabs { display: flex; gap: 4px; border-top: 1px solid var(--rule); }
.tabs a { flex: 1; text-align: center; padding: 10px 6px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--now); }

/* save / sync status pill */
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; background: transparent; cursor: default; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sync[data-state="saving"]::before { background: var(--now); animation: pulse 1s infinite; }
.sync[data-state="offline"]::before, .sync[data-state="stale"]::before { background: var(--warn); }
.sync[data-state="error"] { color: var(--bad); border-color: var(--bad); cursor: pointer; }
.sync[data-state="error"]::before { background: var(--bad); }
.sync[data-state="local"]::before, .sync[data-state="readonly"]::before { background: var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }

.banner { margin-block: 10px 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--fg); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.banner.info { background: var(--surface-2); }
.banner.bad { background: var(--bad-bg); }
.banner b { font-weight: 600; }
.banner .grow { flex: 1; min-width: 12em; }

/* ---------- generic ---------- */
.page-head { padding-block: 22px 6px; display: grid; gap: 6px; }
.page-head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 5.6vw, 34px); line-height: 1.15; margin: 0; }
.page-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--fg); white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--now); border-color: var(--now); color: var(--on-now); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.6; padding: 0 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.chip.key { font-family: var(--f-chord); font-weight: 600; color: var(--chord); }
.chip.ok { color: var(--ok); border-color: transparent; background: var(--ok-bg); }
.chip.warn { color: var(--warn); border-color: transparent; background: var(--warn-bg); }
.chip.bad { color: var(--bad); border-color: transparent; background: var(--bad-bg); }
.empty { color: var(--muted); padding: 24px 4px; text-align: center; }
.search { position: relative; margin-block: 12px 4px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 48px; padding: 0 14px 0 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); font-size: 17px; }
.search input:focus { outline: none; border-color: var(--chord); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding-block: 6px; }
.filters button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* lists */
.list { display: grid; border-top: 1px solid var(--rule); }
.item-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; min-width: 0; }
.item-row .n { font-family: var(--f-chord); color: var(--muted); font-size: 13px; min-width: 2em; font-variant-numeric: tabular-nums; }
.item-row .t { min-width: 0; }
.item-row .t b { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.item-row .t .a { display: block; font-size: 13px; color: var(--muted); }
.item-row .t .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.item-row .t .note { display: block; font-size: 13px; color: var(--muted); font-style: italic; margin-top: 2px; }
.item-row .acts { display: flex; gap: 6px; align-items: center; }
a.item-row:hover b, .item-row .open:hover b { color: var(--chord); }
.item-row .open { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; min-width: 0; }

/* events */
.event-card { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); text-decoration: none; color: inherit; }
.event-card:hover { border-color: var(--muted); }
.event-card h3 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.event-card .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.events { display: grid; gap: 10px; padding-block: 10px 30px; }
.section-title { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }

.set { margin-top: 18px; }
.set-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; }
.set-head h2 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.set-head .meta { color: var(--muted); font-size: 13px; }
.set .list { min-height: 52px; }
.set.drop-target .list { outline: 2px dashed var(--now); outline-offset: 4px; border-radius: 6px; }
.handle { width: 36px; height: 44px; display: grid; place-items: center; cursor: grab; color: var(--muted); touch-action: none; border: 0; background: none; border-radius: 8px; }
.handle:active { cursor: grabbing; }
.handle svg { width: 20px; height: 20px; }
.dragging { opacity: .35; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: var(--surface); border: 1px solid var(--now); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 10px 14px; font-weight: 600; max-width: 80vw; }
.drop-line { height: 3px; background: var(--now); border-radius: 2px; margin: -2px 0; }

.break-row { background: var(--surface-2); }
.break-row .t b { font-size: 15px; color: var(--muted); }
details.ready { margin-top: 12px; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
details.ready summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.ready .issues { margin-top: 10px; }
details.ready .issues a { font-weight: 600; }
.history-list { display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
.history-list .h { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; flex-wrap: wrap; }
.offline-state { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* totals bar */
.totals { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14px; padding-block: 6px; }
.totals b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.totals .over { color: var(--bad); }

/* ---------- forms, dialogs ---------- */
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label.f > span { font-weight: 600; }
.f input, .f select, .f textarea { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); font-size: 16px; }
.f textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--chord); }
.f .err { color: var(--bad); font-size: 13px; }
.f input[aria-invalid="true"], .f textarea[aria-invalid="true"] { border-color: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.checks input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .scrim { align-items: center; padding: 24px; } }
.sheet-dlg {
  background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: var(--shadow-pop); display: grid; gap: 14px;
}
@media (min-width: 700px) { .sheet-dlg { border-radius: 18px; } }
.sheet-dlg h2 { margin: 0; font-family: var(--f-display); font-size: 22px; }
.sheet-dlg .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--surface); padding-block: 10px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: var(--shadow-pop); }
.toast { display: flex; align-items: center; gap: 12px; }
.toast-act { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; font-weight: 600; cursor: pointer; }
.player-on .toast { bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }

/* picker */
.pick-list { display: grid; max-height: 50vh; overflow: auto; border: 1px solid var(--rule); border-radius: 10px; }
.pick-list label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.pick-list label:last-child { border-bottom: 0; }
.pick-list input { width: 20px; height: 20px; }
.pick-list .a { display: block; font-size: 13px; color: var(--muted); }

/* ---------- editor ---------- */
.editor { display: grid; gap: 14px; padding-block: 16px 120px; }
.editor-cols { display: grid; gap: 14px; }
@media (min-width: 980px) { .editor-cols { grid-template-columns: 1fr 1fr; align-items: start; } .wrap.wide { max-width: 1180px; } }
.editor textarea#ed-text { font-family: var(--f-chord); font-size: 15px; min-height: 340px; white-space: pre; overflow-wrap: normal; overflow-x: auto; tab-size: 4; }
.preview { border: 1px solid var(--rule); border-radius: 12px; padding: 12px 18px; background: var(--surface); font-size: 18px; min-width: 0; }
.preview .sheet { padding-bottom: 0; gap: 18px; font-size: 18px; }
.preview .song-head { min-height: 0; padding-block: 0 8px; }
.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issues li { padding: 8px 10px; border-radius: 8px; font-size: 14px; background: var(--surface-2); }
.issues li.err { background: var(--bad-bg); color: var(--bad); }
.issues li.warn { background: var(--warn-bg); }
.issues li button { margin-left: 6px; }
.help { font-size: 13px; color: var(--muted); }
.help code { font-family: var(--f-chord); background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
details.help summary { cursor: pointer; font-weight: 600; color: var(--fg); }
.dropzone { border: 2px dashed var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--muted); }
.dropzone.over { border-color: var(--now); background: var(--now-bg); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.thumb { position: relative; width: 120px; display: grid; gap: 4px; justify-items: center; font-size: 12px; }
.thumb img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface-2); }
.thumb .n { position: absolute; top: 4px; left: 4px; background: var(--fg); color: var(--bg); border-radius: 999px; font-size: 11px; padding: 0 7px; }
.thumb .row { gap: 4px; }
.thumb button { min-width: 32px; height: 30px; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; cursor: pointer; }
.progress { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--now); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.unclear { background: var(--warn-bg); outline: 1px dashed var(--warn); border-radius: 3px; }
.ch.unclear { color: var(--warn); }

/* ---------- player (song sheet) ---------- */
.song-head { padding-block: 22px 18px; display: grid; gap: 4px; min-height: calc(var(--guide) - 56px); align-content: end; }
.song-head h1 { font-family: var(--f-display); font-weight: 700; font-size: calc(30px * var(--scale)); line-height: 1.15; margin: 0; }
.song-head .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; }
.song-head .meta b { font-family: var(--f-chord); color: var(--chord); font-weight: 600; }
.sheet { display: grid; gap: calc(26px * var(--scale)); padding-bottom: 75vh; font-size: calc(21px * var(--scale)); }
.stanza { display: grid; gap: calc(4px * var(--scale)); }
.sec { font-family: var(--f-display); font-weight: 600; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.sec.on { color: var(--now); }
.line { position: relative; border-radius: 8px; padding: 2px 10px 6px; margin: 0 -10px; cursor: pointer; transition: opacity .3s, background-color .3s; }
.line::before { content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--now); opacity: 0; transition: opacity .2s; }
.line::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: var(--now); opacity: 0; transform-origin: left; transform: scaleX(var(--p, 0)); }
.line.past { opacity: .32; }
.line.now { background: var(--now-bg); }
.line.now::before { opacity: 1; }
.playing .line.now::after { opacity: .7; }
.preview .line { cursor: default; }
.lyr { display: flex; flex-wrap: wrap; align-items: flex-start; }
.seg { display: inline-flex; flex-direction: column; max-width: 100%; }
.ch { font-family: var(--f-chord); font-weight: 600; color: var(--chord); font-size: .86em; line-height: 1.25; padding-right: .55em; white-space: nowrap; min-height: 1.25em; }
.ly { white-space: pre-wrap; line-height: 1.55; }
.lyr.nochord .ch { display: none; }
.lyr.onlychord .ly { display: none; }
.lyr.onlychord .ch { font-size: .95em; padding-right: 1.1em; }
.instru { background: var(--instru-bg); padding: 10px 12px 12px; margin: 0 -10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.instru .lab { font-family: var(--f-display); font-weight: 600; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.instru.now .lab { color: var(--now); }
.bars { display: flex; flex-wrap: wrap; align-items: center; }
.bars span { font-family: var(--f-chord); font-weight: 600; color: var(--chord); font-size: .9em; padding: 0 .55em; border-left: 2px solid var(--rule); line-height: 1.5; }
.bars span:last-child { border-right: 2px solid var(--rule); }
.instru .note { color: var(--muted); font-size: .72em; }
.line.notel { color: var(--muted); font-style: italic; font-size: .85em; }

.next-song { padding-block: 0 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.next-song a { color: var(--chord); text-decoration: none; font-weight: 600; }
.guide { position: fixed; top: var(--guide); left: 0; right: 0; height: 0; pointer-events: none; z-index: 5; }
.guide::before, .guide::after { content: ""; position: absolute; top: -7px; border: 7px solid transparent; }
.guide::before { left: max(0px, env(safe-area-inset-left, 0px)); border-left-color: var(--now); }
.guide::after { right: max(0px, env(safe-area-inset-right, 0px)); border-right-color: var(--now); }

.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player .wrap { display: grid; gap: 6px; padding-block: 8px 10px; }
.status { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.status .now-sec { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--now); white-space: nowrap; }
.status .next-sec { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.beats { display: flex; gap: 5px; align-self: center; }
.beats i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }

.play svg { width: 26px; height: 26px; }

.tap { font-family: var(--f-display); font-weight: 600; font-size: 13px; padding: 0 8px; }

.stage .sheet { font-size: calc(26px * var(--scale)); }
.stage .line.past { opacity: .18; }

@media (max-width: 420px) {

    const path = e.key.slice(PREFIX.length);
    if (path.startsWith("__index/")) { const col = path.slice(8); for (const l of listeners) if (l.kind === "col" && l.path === col) l.fn(colSnap(col)); }
    else emit(path);
  });
  const leases = new Map();
  function docRef(path) {
    const [col, id] = split(path);
    return {
      id, path,
      async get() { return freeze(id, read(path)); },
      async set(data) {
        const ids = index(col);
        writeRaw(path, JSON.parse(JSON.stringify(data)));
        if (!ids.includes(id)) writeRaw("__index/" + col, [...ids, id]);
        emit(path);
      },
      async update(data) {
        const cur = read(path);
        if (cur === undefined) throw { code: "invalid_argument", message: "document does not exist" };
        writeRaw(path, { ...cur, ...JSON.parse(JSON.stringify(data)) });
        emit(path);
      },
      async delete() {
        writeRaw(path, undefined);
        writeRaw("__index/" + col, index(col).filter(x => x !== id));
        emit(path);
      },
      async acquire({ holder, ttlMs = 30000 }) {
        const t = Date.now(), cur = leases.get(path);
        if (cur && cur.holder !== holder && cur.until > t) return { acquired: false, expiresAt: new Date(cur.until).toISOString() };
        const until = t + Math.min(600000, Math.max(1000, ttlMs));
        leases.set(path, { holder, until });
        return { acquired: true, holder, expiresAt: new Date(until).toISOString(), version: 1 };
      },
      onSnapshot(fn) { const l = { kind: "doc", path, fn }; listeners.add(l); setTimeout(() => fn(freeze(id, read(path))), 0); return () => listeners.delete(l); }
    };
  }
  function colRef(col) {
    return {
      path: col,
      doc(id) { return docRef(col + "/" + (id || newId())); },
      async add(data) { const r = docRef(col + "/" + newId()); await r.set(data); return r; },
      async get() { return colSnap(col); },
      onSnapshot(fn) { const l = { kind: "col", path: col, fn }; listeners.add(l); setTimeout(() => fn(colSnap(col)), 0); return () => listeners.delete(l); }
    };
  }
  return {
    doc: docRef, collection: colRef,
    /** true when this device has never stored anything for the app */
    isEmpty() { return ["songs", "events", "items"].every(c => !index(c).length) && !read("__meta/seeded"); },
    markSeeded() { writeRaw("__meta/seeded", { at: Date.now() }); }
  };
}

/* ---------- Supabase: one band's data shared across devices (public link) ----------
   When the page is built with a Supabase project (cloud.json) and opened outside claude.ai, a signed-in
   member works on their band's shared data. createCloudDB() offers the same small API as the claude.ai
   database and LocalDB, so the rest of the app does not change:
   - every write shows up at once (optimistic), then goes to Supabase; if the network is down it waits in
     an outbox kept in this browser and is sent when the connection returns (also after a reload);
   - everything last seen is cached per person and band, so a prepared gig opens without internet;
   - other members' changes arrive live through Supabase Realtime, and a full reload after reconnecting
     catches anything missed;
   - song saves use put_doc_if on the server, so two people saving the same song never silently overwrite. */
const Cloud = { cfg: typeof CLOUD_CONFIG !== "undefined" ? CLOUD_CONFIG : null, sb: null, user: null, bands: [], band: null, role: null, realtime: "off", db: null };
const cloudConfigured = () => !!(Cloud.cfg && Cloud.cfg.url && Cloud.cfg.anonKey && window.supabase && window.supabase.createClient);
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(String(e && (e.message || e)));
function cloudErr(e) {
  if (!e) return { code: "unavailable", message: "unknown" };
  if (isNetErr(e)) return { code: "offline", message: String(e.message || e) };
  if (e.code === "42501" || /row-level security|permission|not allowed/i.test(e.message || "")) return { code: "invalid_argument", message: e.message };
  if (e.code === "P0002") return { code: "not_found", message: e.message };
  return { code: e.code || "unavailable", message: e.message || String(e) };
}

async function cloudStart() {
  if (!cloudConfigured()) return null;
  Cloud.sb = window.supabase.createClient(Cloud.cfg.url, Cloud.cfg.anonKey, {
    auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "chordscroll-auth" }
  });
  let session = null;
  try { session = (await Cloud.sb.auth.getSession()).data.session; } catch (e) { /* offline: stored session still works below */ }
  // a sign-in link brings ?code=… back to the page; supabase-js has used it by now, so tidy the address bar
  const q = new URLSearchParams(location.search);
  if (q.has("code") || q.has("error_description")) { q.delete("code"); q.delete("error"); q.delete("error_code"); q.delete("error_description"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); }
  Cloud.user = session ? session.user : null;
  Cloud.sb.auth.onAuthStateChange((event, s) => {
    const had = !!Cloud.user, has = !!(s && s.user);
    if (had !== has) location.reload();   // signed in or out in this or another tab: start over cleanly
  });
  if (!Cloud.user) return null;
  prefs.owner = Cloud.user.id;
  const join = new URLSearchParams(location.search).get("join");
  if (join) {
    const { data, error } = await Cloud.sb.rpc("accept_invite", { p_code: join, p_display_name: prefs.get("myName", "") });
    const q2 = new URLSearchParams(location.search); q2.delete("join");
    history.replaceState(null, "", location.pathname + (q2.toString() ? "?" + q2 : "") + location.hash);
    if (error) setTimeout(() => toast("ลิงก์เชิญใช้ไม่ได้: หมดอายุหรือถูกใช้ครบแล้ว ขอลิงก์ใหม่จากเจ้าของวง", 7000), 500);
    else { prefs.set("cloudBand", data); setTimeout(() => toast("เข้าร่วมวงแล้ว"), 500); }
  }
  await loadBands();
  if (!Cloud.bands.length) return null;
  Cloud.band = Cloud.bands.find(b => b.id === prefs.get("cloudBand", "")) || Cloud.bands[0];
  Cloud.role = Cloud.band.role;
  prefs.set("cloudBand", Cloud.band.id);
  Cloud.db = createCloudDB(Cloud.band.id, Cloud.user.id);
  return Cloud.db;
}
async function loadBands() {
  const key = "chordscroll-cloud-bands:" + Cloud.user.id;
  const { data, error } = await Cloud.sb.from("band_members").select("band_id, role, display_name, bands(name)").eq("user_id", Cloud.user.id);
  if (!error && data) {
    Cloud.bands = data.map(r => ({ id: r.band_id, role: r.role, myName: r.display_name, name: r.bands ? r.bands.name : "วง" }));
    try { localStorage.setItem(key, JSON.stringify(Cloud.bands)); } catch (e) { /* cache optional */ }
    // no longer in a band (left or removed): drop this device's copy of that band's data
    forgetCloudData(Cloud.user.id, new Set(Cloud.bands.map(b => b.id)));
  } else {
    try { Cloud.bands = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { Cloud.bands = []; }
  }
}

function createCloudDB(bandId, userId) {
  const sb = Cloud.sb;
  const COLS = ["songs", "events", "items"];
  const cacheKey = "chordscroll-cloud:" + userId + ":" + bandId;
  const outKey = cacheKey + ":outbox";
  const local = {}; COLS.forEach(c => local[c] = new Map());
  const loaded = {};
  let cachedAt = 0;
  try {
    const c = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (c) { COLS.forEach(col => (c[col] || []).forEach(([id, d]) => local[col].set(id, d))); cachedAt = c.at || 0; }
  } catch (e) { /* no cache yet */ }
  let outbox = [];
  try { outbox = JSON.parse(localStorage.getItem(outKey) || "[]"); } catch (e) { outbox = []; }
  const waiters = new Map();          // op id → {resolve, reject} for writes made in this page
  const listeners = new Set();        // {col, fn}
  let closed = false;
  const saveCache = () => {
    if (closed) return;
    try { localStorage.setItem(cacheKey, JSON.stringify({ at: Date.now(), ...Object.fromEntries(COLS.map(c => [c, [...local[c]]])) })); } catch (e) { /* full disk: cache is optional */ }
  };
  let cacheTimer = 0;
  const saveCacheSoon = () => { clearTimeout(cacheTimer); cacheTimer = setTimeout(saveCache, 400); };
  const saveOutbox = () => { try { localStorage.setItem(outKey, JSON.stringify(outbox)); } catch (e) { /* if this fails the write still waits in memory */ } };
  const snap = (id, data, fromCache) => ({ id, exists: data !== undefined, data: () => data === undefined ? undefined : JSON.parse(JSON.stringify(data)), metadata: { fromCache: !!fromCache, hasPendingWrites: false } });
  function emit(col) {
    const docs = [...local[col]].map(([id, d]) => snap(id, d, !loaded[col]));
    const s = { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: !loaded[col], hasPendingWrites: outbox.length > 0 } };
    for (const l of listeners) if (l.col === col) l.fn(s);
    saveCacheSoon();
  }
  async function fetchAll(col) {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from("docs").select("id, data").eq("band_id", bandId).eq("col", col).range(from, from + 999);
      if (error) throw cloudErr(error);
      rows.push(...data);
      if (data.length < 1000) break;
    }
    return rows;
  }
  async function reloadAll() {
    for (const col of COLS) {
      try {
        const rows = await fetchAll(col);
        const m = new Map(rows.map(r => [r.id, r.data]));
        // keep our own writes that have not reached the server yet
        for (const op of outbox) if (op.col === col) { if (op.op === "delete") m.delete(op.id); else if (op.op === "merge") { const cur = m.get(op.id); if (cur) m.set(op.id, { ...cur, ...op.data }); } else m.set(op.id, op.data); }
        local[col] = m; loaded[col] = true; emit(col);
      } catch (e) { emit(col); }
    }
    notify("sync");
  }
  async function send(op) {
    if (op.op === "set") { const { error } = await sb.from("docs").upsert({ band_id: bandId, col: op.col, id: op.id, data: op.data }); if (error) throw cloudErr(error); }
    else if (op.op === "merge") { const { error } = await sb.rpc("merge_doc", { p_band: bandId, p_col: op.col, p_id: op.id, p_patch: op.data }); if (error) throw cloudErr(error); }
    else if (op.op === "delete") { const { error } = await sb.from("docs").delete().eq("band_id", bandId).eq("col", op.col).eq("id", op.id); if (error) throw cloudErr(error); }
  }
  let flushing = false;
  async function flush() {
    if (flushing || !outbox.length || !navigator.onLine) return;
    flushing = true;
    try {
      while (outbox.length) {
        const op = outbox[0];
        try { await send(op); }
        catch (e) {
          if (e.code === "offline") break;           // still offline: try again later
          outbox.shift(); saveOutbox();               // the server refused it: report it and undo it locally
          const w = waiters.get(op.opId); if (w) { waiters.delete(op.opId); w.reject(e); }
          else setTimeout(() => toast("การแก้ไขที่ค้างอยู่ถูกปฏิเสธ: " + errText(e), 6000), 0);
          refetchOne(op.col, op.id);
          continue;
        }
        outbox.shift(); saveOutbox();
        const w = waiters.get(op.opId); if (w) { waiters.delete(op.opId); w.resolve(); }
      }
    } finally { flushing = false; notify("sync"); }
  }
  async function refetchOne(col, id) {
    const { data } = await sb.from("docs").select("data").eq("band_id", bandId).eq("col", col).eq("id", id).maybeSingle();
    if (data) local[col].set(id, data.data); else local[col].delete(id);
    emit(col);
  }
  function queue(op) {
    op.opId = newId(); op.at = Date.now();
    outbox.push(op); saveOutbox();
    const p = new Promise((resolve, reject) => waiters.set(op.opId, { resolve, reject }));
    flush();
    return p;
  }
  window.addEventListener("online", () => { flush().then(reloadAll); });
  setInterval(() => { if (outbox.length) flush(); }, 15000);

  // live changes from other members
  const channel = sb.channel("band-" + bandId)
    .on("postgres_changes", { event: "*", schema: "public", table: "docs", filter: "band_id=eq." + bandId }, p => {
      const row = p.new && p.new.col ? p.new : p.old;
      if (!row || !COLS.includes(row.col)) return;
      if (outbox.some(o => o.col === row.col && o.id === row.id)) return;   // our own pending change wins locally until it is sent
      if (p.eventType === "DELETE") local[row.col].delete(row.id); else local[row.col].set(row.id, p.new.data);
      emit(row.col);
    })
    .subscribe(status => {
      const was = Cloud.realtime; Cloud.realtime = status;
      if (status === "SUBSCRIBED" && was !== "SUBSCRIBED" && was !== "off") reloadAll();   // reconnected: catch up
      notify("sync");
    });

  const api = {
    bandId,
    pending: () => outbox.length,
    cachedAt: () => cachedAt,
    doc(path) {
      const [col, id] = [path.slice(0, path.lastIndexOf("/")), path.slice(path.lastIndexOf("/") + 1)];
      return {
        id, path,
        async get() {
          if (col === "history" || navigator.onLine) {
            const { data, error } = await sb.from("docs").select("data").eq("band_id", bandId).eq("col", col).eq("id", id).maybeSingle();
            if (!error) return snap(id, data ? data.data : undefined, false);
            if (!isNetErr(error)) throw cloudErr(error);
          }
          if (!local[col]) throw { code: "offline", message: "offline" };
          return snap(id, local[col].get(id), true);
        },
        set(data) {
          const body = JSON.parse(JSON.stringify(data));
          if (local[col]) { local[col].set(id, body); emit(col); }
          return queue({ op: "set", col, id, data: body });
        },
        update(patch) {
          const p = JSON.parse(JSON.stringify(patch));
          if (local[col]) {
            const cur = local[col].get(id);
            if (!cur) return Promise.reject({ code: "invalid_argument", message: "document does not exist" });
            local[col].set(id, { ...cur, ...p }); emit(col);
          }
          return queue({ op: "merge", col, id, data: p });
        },
        delete() {
          if (local[col]) { local[col].delete(id); emit(col); }
          return queue({ op: "delete", col, id });
        },
        /** Atomic save: only if the stored "rev" is still expectedRev. Rejects {code:"conflict", current} or {code:"offline"}. */
        async putIfRev(data, expectedRev) {
          if (!navigator.onLine) throw { code: "offline", message: "offline" };
          const { data: r, error } = await sb.rpc("put_doc_if", { p_band: bandId, p_col: col, p_id: id, p_data: data, p_expected_rev: expectedRev });
          if (error) throw cloudErr(error);
          if (r && r.ok) { if (local[col]) { local[col].set(id, JSON.parse(JSON.stringify(data))); emit(col); } return; }
          throw { code: "conflict", current: r && r.current ? r.current : null, message: "changed by someone else" };
        },
        async acquire({ holder, ttlMs }) { return { acquired: true, holder, expiresAt: new Date(Date.now() + (ttlMs || 30000)).toISOString() }; },
        onSnapshot(fn) { return api.collection(col).onSnapshot(s => { const d = s.docs.find(x => x.id === id); fn(d || snap(id, undefined, s.metadata.fromCache)); }); }
      };
    },
    collection(col) {
      return {
        path: col,
        doc: id => api.doc(col + "/" + (id || newId())),
        async get() {
          if (local[col] && loaded[col]) return { docs: [...local[col]].map(([id, d]) => snap(id, d, false)), size: local[col].size };
          const rows = await fetchAll(col);
          const docs = rows.map(r => snap(r.id, r.data, false));
          return { docs, size: docs.length, empty: !docs.length };
        },
        onSnapshot(fn) {
          const l = { col, fn }; listeners.add(l);
          setTimeout(() => emit(col), 0);
          return () => listeners.delete(l);
        }
      };
    },
    close() { closed = true; clearTimeout(cacheTimer); try { sb.removeChannel(channel); } catch (e) { /* page is going away */ } }
  };
  // start: show the cache right away, then load fresh data and send anything left from last time
  setTimeout(() => { COLS.forEach(emit); flush().then(reloadAll); }, 0);
  return api;
}

        go.disabled = false;
        if (error) { err.textContent = /rate|seconds/i.test(error.message) ? "ส่งถี่เกินไป รอสักครู่แล้วลองใหม่" : isNetErr(error) ? "ต้องต่ออินเทอร์เน็ตเพื่อเข้าสู่ระบบ" : "ส่งไม่สำเร็จ: " + error.message; return; }

        $("#si-code", el).focus();

    });

/** Remove this device's cached band data for `uid` (all bands, or all except `keep`). Unsent writes are kept. */
function forgetCloudData(uid, keep) {
  try {
    const prefix = "chordscroll-cloud:" + uid + ":";
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(prefix)) continue;
      if (k.endsWith(":outbox")) { if (!keep && (localStorage.getItem(k) || "[]") === "[]") drop.push(k); continue; }   // never drop unsent work
      const band = k.slice(prefix.length);
      if (!keep || !keep.has(band)) drop.push(k);
    }
    drop.forEach(k => localStorage.removeItem(k));
    if (!keep) localStorage.removeItem("chordscroll-cloud-bands:" + uid);
    for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith("chordscroll-offline-pack:")) localStorage.removeItem(k); }
  } catch (e) { /* storage blocked */ }
}
async function cloudSignOut() {
  const pending = Cloud.db ? Cloud.db.pending() : 0;
  if (pending && !(await confirmDialog("ยังมีการแก้ไขที่ส่งไม่ถึงเซิร์ฟเวอร์", `${pending} รายการยังรอส่ง ถ้าออกจากระบบตอนนี้ รายการเหล่านั้นจะรอในเครื่องนี้จนกว่าคุณจะเข้าสู่ระบบอีกครั้ง`, "ออกจากระบบ", true))) return;
  if (Cloud.db) Cloud.db.close();
  forgetCloudData(Cloud.user.id, null);   // shared phone: the next person must not find this band's data here
  await Cloud.sb.auth.signOut();
}
async function cloudCreateBand(copyLocal) {

/** After creating a band from a device that already has songs: copy them up once. */
async function cloudCopyLocalIfAsked() {

  await applyRestore(r, false);
}

const inviteUrl = code => location.origin + location.pathname + "?join=" + encodeURIComponent(code);

/* image reading through the band's Supabase function (same interface the editor uses for claude.ai) */
function cloudSampler() {
  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });

    try {
      const bmp = await createImageBitmap(blob);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (k === 1 && blob.size < 3.5e6 && /jpeg|png|webp/.test(blob.type)) return blob;
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
    } catch (e) { return blob; }
  }
  const fn = {
    async json(prompt, { images, signal, tiled } = {}) {
      const list = [];
      for (const b of [].concat(images || [])) { const s = await shrink(b); list.push({ media_type: s.type || "image/jpeg", data: await toB64(s) }); }
      if (signal && signal.aborted) throw { code: "cancelled" };
      const call = Cloud.sb.functions.invoke("read-chords", { body: { bandId: Cloud.band.id, images: list, tiled: !!tiled } });
      const res = await (signal ? Promise.race([call, new Promise((_, rej) => signal.addEventListener("abort", () => rej({ code: "cancelled" })))]) : call);
      if (res.error) {
        let body = null;
        try { body = res.error.context && typeof res.error.context.json === "function" ? await res.error.context.json() : null; } catch (e) { /* not JSON */ }
        throw { code: (body && body.code) || (isNetErr(res.error) ? "upstream_error" : "upstream_error"), message: (body && body.message) || res.error.message };
      }
      return res.data;
    },
    async limits() { return { maxPromptBytes: 262144, images: { maxCount: 8, maxInputBytes: 20e6, mediaTypes: ["image/jpeg", "image/png", "image/webp", "image/gif"] } }; }
  };
  return fn;
}

/* ---------- chords ---------- */
const NOTES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
const IDX = { C: 0, "B#": 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, Fb: 4, F: 5, "E#": 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11, Cb: 11 };

const CHORD_RE = /^\(?[A-G](#|b)?(m(?!aj)|min|dim|aug|\+|°|ø)?(maj|M)?\d{0,2}(maj\d{0,2}|M\d{0,2}|add\d{1,2}|sus\d?|[b#]\d{1,2}|no\d|dim\d?|aug)*(\/[A-G](#|b)?)?\)?\??$/;

/** Shift every note name in a chord symbol (root and slash bass) by s semitones. */
function tr(ch, s) {
  if (!s || !ch) return ch;
  return ch.replace(/(^|[\/(\s|])([A-G](?:#|b)?)/g, (m, pre, root) => IDX[root] == null ? m : pre + NOTES[(((IDX[root] + s) % 12) + 12) % 12]);

  for (const b of blocks || []) {
    if (b.type === "instru" && b.bars && b.bars.length) return b.bars[0].split(/\s+/)[0];
    if (b.type === "lines") for (const l of b.lines) for (const [c] of l) if (c) return c;
  }

}

/* ---------- sections & timing ----------
   Each playable row gets a length in bars (4/4):
   - lyric line: 2 bars, or half its chord count when it has more than 4 chords
   - chord-only line: one bar per chord
   - INTRO / INSTRU box: its bars, times the "( n Times )" note
   Section names: an explicit "## name" wins; a stanza starting with "**" is the hook (and "*" is then
   the pre-hook); if the song only uses "*", that is the hook; other stanzas are verses.
   "( ซ้ำ * , ** )" writes the repeated stanzas out again so the timeline follows the real song. */

      const copies = marks.map(n => blocks.find(x => x.type === "lines" && stanzaMark(x) === n)).filter(Boolean);
      if (copies.length === marks.length) { copies.forEach(c => blocks.push({ ...c, repeat: true })); return; }
    }
    blocks.push(b);

  const lastInstru = blocks.map(b => b.type).lastIndexOf("instru");
  const firstLines = blocks.findIndex(b => b.type === "lines");
  const out = [];
  let pendingHeader = null, prevInstruName = null;
  blocks.forEach((b, i) => {
    if (b.type === "note" && HEADER_RE.test(b.text.trim()) && !/ซ้ำ/.test(b.text)) { pendingHeader = b.text.trim(); return; }
    if (b.type === "instru") {
      let name;
      if (!b.label && prevInstruName) name = prevInstruName;
      else if ((firstLines < 0 ? false : i < firstLines) || /intro|อินโทร/i.test(b.label || "")) name = "อินโทร";
      else if (i === lastInstru && blocks.slice(i + 1).every(x => x.type !== "lines")) name = "เอาท์โทร";
      else name = "ดนตรี";
      if (pendingHeader) { name = pendingHeader; pendingHeader = null; }
      prevInstruName = name;
      const m = /(\d+)\s*(times|ครั้ง|รอบ)|x\s*(\d+)/i.exec(b.note || "");

/* ---------- song text format ----------
   One song as plain text, easy to type, paste or fix by hand:

     [INTRO] | Em | Em | C | C | ( 2 Times )     a box of bars (INTRO, INSTRU, OUTRO, SOLO ...)
     | C | C | C | C |                            more bars of the box above
     ## ฮุค                                        name the next stanza (optional)
     [Em]สุดท้าย.. ต่อให้เหนี่ยว [Am]รั้งสักเท่าไหร่   chord in brackets right before the syllable under it
                                                  (blank line) = new stanza
     > ( ซ้ำ * , ** )                              a note; "( Till End )" marks the end
     [Am?]  {?คำ}                                  "?" = read unclearly from the picture; check before trusting
*/
const INSTRU_RE = /^\s*\[?\s*(INTRO|INSTRU(?:MENTS?|MENTAL)?|OUTRO|SOLO|ENDING|BREAK|INTERLUDE|อินโทร|ดนตรี|โซโล่|เอาท์โทร|ท่อนจบ)\s*\]?\s*:?\s*(.*)$/i;

function blocksToText(blocks) {
  const out = [];
  let prev = null;
  for (const b of blocks || []) {
    if (b.type === "lines") {
      if (out.length) out.push("");
      if (b.section) out.push("## " + b.section);
      for (const l of b.lines) out.push(l.map(([c, t]) => (c ? "[" + c + "]" : "") + (t || "")).join("").replace(/\s+$/, ""));
    } else if (b.type === "instru") {
      if (out.length && !(prev && prev.type === "instru" && !b.label)) out.push("");
      const bars = "| " + (b.bars || []).join(" | ") + " |";
      out.push((b.label ? "[" + b.label + "] " : "") + bars + (b.note ? " " + b.note : ""));
    } else if (b.type === "note" || b.type === "end") {
      if (out.length) out.push("");
      out.push("> " + b.text);
    }
    prev = b;
  }
  return out.join("\n") + (out.length ? "\n" : "");
}

/** Parse the text format. Never throws: problems come back as errors (block saving) or warnings. */
function textToBlocks(text) {
  const blocks = [], errors = [], warnings = [];
  let stanza = null, section = null, lastWasInstru = false;
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const close = () => { if (stanza && stanza.lines.length) blocks.push(stanza); stanza = null; };
  lines.forEach((raw, i) => {
    const n = i + 1;
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) { close(); lastWasInstru = false; return; }
    const t = line.trim();
    if (t.startsWith("## ")) { close(); section = t.slice(3).trim() || null; lastWasInstru = false; return; }
    if (t.startsWith(">")) {
      close();
      const body = t.replace(/^>\s*/, "");
      blocks.push(/till\s*end|^\(?\s*จบ\s*\)?$/i.test(body) ? { type: "end", text: body } : { type: "note", text: body });
      lastWasInstru = false; return;
    }
    const im = INSTRU_RE.exec(t);
    const contBars = lastWasInstru && t.startsWith("|");
    if ((im && im[2].includes("|")) || contBars) {
      close();
      const label = contBars ? "" : im[1];
      const rest = contBars ? t : im[2];
      const lastPipe = rest.lastIndexOf("|");
      const barsPart = rest.slice(0, lastPipe + 1), note = rest.slice(lastPipe + 1).trim();
      const bars = barsPart.split("|").map(s => s.trim()).filter(Boolean);
      bars.forEach(bar => bar.split(/\s+/).forEach(c => { if (!isChord(c)) errors.push({ line: n, msg: `คอร์ด “${c}” ในกล่อง ${label || "ดนตรี"} ไม่ใช่รูปแบบคอร์ด` }); }));
      if (!bars.length) errors.push({ line: n, msg: "กล่องดนตรีไม่มีคอร์ด ใส่แบบ | Em | C |" });
      blocks.push({ type: "instru", label, bars, note });
      lastWasInstru = true; return;
    }
    lastWasInstru = false;
    // lyric line with [Chord] marks
    const segs = [];
    let pos = 0, cur = ["", ""], bad = false;
    const re = /\[([^\]\n]*)\]/g;
    let m;
    while ((m = re.exec(line))) {
      cur[1] += line.slice(pos, m.index);
      if (cur[0] || cur[1]) segs.push(cur);
      const c = m[1].trim();
      if (!c) { errors.push({ line: n, msg: "มีวงเล็บ [ ] ว่าง" }); bad = true; }
      else if (!isChord(c)) { errors.push({ line: n, msg: `“${c}” ไม่ใช่รูปแบบคอร์ด (เช่น Am, C#m7, D/F#)` }); bad = true; }
      cur = [c, ""];
      pos = re.lastIndex;
    }
    cur[1] += line.slice(pos);
    if (cur[0] || cur[1]) segs.push(cur);
    if (/[\[\]]/.test(segs.map(s => s[1]).join(""))) { errors.push({ line: n, msg: "วงเล็บ [ ] ไม่ครบคู่" }); bad = true; }
    const opens = (line.match(/\{\?/g) || []).length, closes = (line.match(/\}/g) || []).length;
    if (opens !== closes) errors.push({ line: n, msg: "เครื่องหมายจุดไม่ชัด {? … } ไม่ครบคู่" });

/* "Chords on their own line above the lyrics" (how most chord sites and PDFs print it) → [Chord] marks.
   Thai vowels and tone marks above/below a consonant take no column, so they are skipped when counting. */
const ZW = /[ัิ-ฺ็-๎̀-ͯ]/;
function colToIndex(s, col) {
  let c = 0;
  for (let i = 0; i < s.length; i++) {
    if (ZW.test(s[i])) continue;
    if (c === col) return i;
    c++;
  }
  return -1;
}

  const toks = line.trim().split(/\s+/).filter(t => t && t !== "|");
  return toks.length > 0 && toks.every(isChord) && !/\[/.test(line);
}
function convertChordsAbove(text) {
  const lines = String(text || "").replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  const out = [];
  let changed = 0;
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (!isChordLine(L) || INSTRU_RE.test(L.trim())) { out.push(L); continue; }
    const chords = [];
    const re = /\S+/g; let m;
    while ((m = re.exec(L))) if (m[0] !== "|") chords.push({ col: m.index, c: m[0] });
    const next = lines[i + 1];
    if (next == null || !next.trim() || isChordLine(next) || next.trim().startsWith(">") || next.trim().startsWith("##")) {
      out.push(chords.map(x => "[" + x.c + "]").join(" ")); changed++; continue;
    }
    let lyric = next.replace(/\s+$/, "");
    for (let k = chords.length - 1; k >= 0; k--) {
      let idx = colToIndex(lyric, chords[k].col);
      if (idx < 0) { lyric = lyric + " ".repeat(Math.max(1, chords[k].col - [...lyric].filter(ch => !ZW.test(ch)).length)); idx = lyric.length; }
      // keep a chord at the start of a Thai syllable: never on a mark, a trailing vowel (ะ า ำ),
      // or the final consonant after ั (ฝั|น → |ฝัน)
      while (idx < lyric.length && ZW.test(lyric[idx])) idx++;
      if (idx > 0 && /[\u0E30\u0E32\u0E33\u0E45]/.test(lyric[idx] || "")) idx--;
      if (idx > 1 && lyric[idx - 1] === "\u0E31") idx -= 2;
      lyric = lyric.slice(0, idx) + "[" + chords[k].c + "]" + lyric.slice(idx);
    }
    out.push(lyric.replace(/\s+$/, ""));
    changed++; i++;
  }
  return { text: out.join("\n"), changed };
}

/** Check a song before saving. Errors block saving; warnings are shown but allowed. */
function validateSong(song, parsed, others) {
  const errors = [...(parsed ? parsed.errors : [])], warnings = [...(parsed ? parsed.warnings : [])];
  if (!String(song.title || "").trim()) errors.unshift({ field: "title", msg: "ใส่ชื่อเพลง" });
  if (song.bpm != null && !validBpm(song.bpm)) errors.push({ field: "bpm", msg: "BPM ต้องเป็นจำนวนเต็ม 40–220" });
  if (!song.blocks || !song.blocks.length) errors.push({ msg: "ยังไม่มีเนื้อเพลงหรือคอร์ด" });
  const st = songStats(song);
  if (song.blocks && song.blocks.length) {
    if (!st.chords) warnings.push({ msg: "ยังไม่มีคอร์ดเลย" });
    if (!st.lyricLines) warnings.push({ msg: "ยังไม่มีเนื้อร้อง (มีแต่คอร์ด)" });
    if (st.unclear) warnings.push({ msg: `มี ${st.unclear} จุดที่อ่านไม่ชัด (สีเหลือง) ตรวจกับต้นฉบับแล้วลบเครื่องหมาย ? ออก` });
  }
  const dup = (others || []).find(o => o.id !== song.id && norm(o.title) === norm(song.title) && norm(o.artist) === norm(song.artist));
  if (dup && String(song.title || "").trim()) warnings.push({ msg: `มีเพลง “${dup.title}${dup.artist ? " – " + dup.artist : ""}” ในคลังแล้ว`, dupId: dup.id });
  return { errors, warnings, stats: st };
}

/* ---------- data ----------
   Shared mode (opened on claude.ai): three flat collections in the artifact's database, shared by
   everyone the artifact is shared with —
     songs/{songId}   the song itself: title, artist, bpm, blocks, check status, rev
     events/{eventId} a gig: name, date, venue, note, planned minutes, its sets [{id, name}]
     items/{itemId}   one song placed in one set of one gig, with that gig's key/capo/BPM/singer/note
   A song is stored once and used by any number of gigs. Ids are permanent random ids, never positions.
   Device mode (the public github.io link, a downloaded file, or no database here): the same collections
   kept in this browser only (see LocalDB). On first open the starter songs are copied in. */
const TAB = newId();
const Store = {
  mode: "loading",          // "loading" | "shared" | "device"
  db: null, user: null,
  me: { id: null, name: "", isOwner: false, canEdit: false },
  canWrite: null,           // true / false / null (platform said nothing; let a refused write decide)
  songs: new Map(), events: new Map(), items: new Map(),
  loaded: { songs: false, events: false, items: false },
  fresh: false,             // a snapshot confirmed by the server has arrived
  slow: false,              // no answer after 10 s
  revoked: false,
  listeners: new Set()
};
const writable = () => Store.mode === "device" || ((Store.mode === "shared" || Store.mode === "cloud") && Store.canWrite !== false && !Store.revoked);
function notify(what) { Store.listeners.forEach(fn => { try { fn(what); } catch (e) { console.error(e); } }); }

async function initStore() {
  const c = window.claude;
  let db = null, user = null;
  if (c && typeof c.use === "function") {
    [db, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
  }
  Store.user = user;
  if (user) {
    try {
      const me = await user.me();
      Store.me = me; prefs.owner = me.id || "anon";
      Store.canWrite = await user.can("data.write");
    } catch (e) { /* reads never reject per contract; keep defaults */ }
  }
  if (!db) {
    const cdb = await cloudStart().catch(e => { console.error(e); return null; });
    if (cdb) {
      Store.db = cdb; Store.mode = "cloud";
      Store.canWrite = Cloud.role !== "viewer";
      Store.me = { id: Cloud.user.id, name: Cloud.band.myName || "", isOwner: Cloud.role === "owner", canEdit: Cloud.role === "owner" };
      subscribeAll(cdb);
      setTimeout(cloudCopyLocalIfAsked, 1500);
      return;
    }
    await openDevice(); return;
  }
  Store.db = db; Store.mode = "shared";
  subscribeAll(db);
}
function subscribeAll(db) {
  const timer = setTimeout(() => { if (!Store.fresh) { Store.slow = true; notify("sync"); } }, 10000);
  for (const name of ["songs", "events", "items"]) {
    db.collection(name).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) { const v = d.data(); if (v) m.set(d.id, { ...v, id: d.id }); }
      Store[name] = m;
      Store.loaded[name] = true;
      if (!snap.metadata.fromCache && Object.values(Store.loaded).every(Boolean)) { Store.fresh = true; Store.slow = false; clearTimeout(timer); }
      notify(name);
    }, err => {
      if (err && err.code === "revoked") Store.revoked = true;
      Store.loaded[name] = true; Store.slow = true;
      clearTimeout(timer);
      notify("sync");
    });
  }
}

async function openDevice() {
  const db = createLocalDB("v1");
  Store.db = db; Store.mode = "device"; Store.canWrite = true;
  const first = db.isEmpty();
  subscribeAll(db);
  if (first) { try { await seedBuiltin(true); db.markSeeded(); } catch (e) { /* reported by track() */ } }
}

/* ---------- queries ---------- */
const songList = () => [...Store.songs.values()].sort((a, b) => a.title.localeCompare(b.title, "th"));
function eventList() {
  return [...Store.events.values()].sort((a, b) => {
    const da = a.date || "9999", dbb = b.date || "9999";
    return da === dbb ? (a.name || "").localeCompare(b.name || "", "th") : da < dbb ? -1 : 1;
  });
}
function eventItems(eventId) {
  const ev = Store.events.get(eventId);
  const setIdx = new Map(((ev && ev.sets) || []).map((s, i) => [s.id, i]));
  return [...Store.items.values()].filter(i => i.eventId === eventId)
    .sort((a, b) => ((setIdx.get(a.setId) ?? 999) - (setIdx.get(b.setId) ?? 999)) || (a.order - b.order));
}
const setItems = (eventId, setId) => eventItems(eventId).filter(i => i.setId === setId);
const itemBpm = (item, song) => validBpm(item && item.bpm) ? item.bpm : validBpm(song && song.bpm) ? song.bpm : 80;
const validDur = v => Number.isInteger(v) && v >= 10 && v <= 3600;
const isBreak = it => it && it.kind === "break";
/** Seconds this row takes in the show: a break's minutes, a typed real length, or the estimate from BPM. */
function itemSecs(it) {
  if (isBreak(it)) return clamp(Number(it.minutes) || 0, 0, 240) * 60;
  if (validDur(it.durationSec)) return it.durationSec;
  const s = Store.songs.get(it.songId);
  return s ? songSeconds(s.blocks, itemBpm(it, s)) : 0;
}
function usageOf(songId) {
  const out = new Map();
  for (const it of Store.items.values()) if (it.songId === songId) out.set(it.eventId, (out.get(it.eventId) || 0) + 1);
  return out;
}
/** Totals for a list of rows: songs, breaks, the gap between songs, readiness. */
function summarize(items, ev) {
  let songSecs = 0, breakSecs = 0, ready = 0, checked = 0, missing = 0, count = 0;
  for (const it of items) {
    if (isBreak(it)) { breakSecs += itemSecs(it); continue; }
    count++;
    const s = Store.songs.get(it.songId);
    if (!s) { missing++; continue; }
    songSecs += itemSecs(it);
    if (songStats(s).ready) ready++;
    if (s.musicCheck === "checked") checked++;
  }
  const gapSecs = ev && ev.gapSeconds > 0 ? Math.max(0, count - 1) * ev.gapSeconds : 0;
  return { count, secs: songSecs + breakSecs + gapSecs, songSecs, breakSecs, gapSecs, ready, checked, missing };
}

/* ---------- saving ----------
   Every write goes through track(): the status pill shows "saving" while any write is in flight,
   "waiting to send" while offline, and lists failed writes with a retry, so the page never claims
   something was saved before the store confirmed it. */
const Sync = { pending: 0, failed: [], lastOk: 0 };
const ERR_TEXT = {
  invalid_argument: "ไม่มีสิทธิ์แก้ไข หรือข้อมูลไม่ถูกต้อง",
  quota_exceeded: "พื้นที่ข้อมูลเต็ม ลบเพลงหรืองานที่ไม่ใช้ก่อน",
  resource_exhausted: "บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่",
  revoked: "สิทธิ์การเข้าถึงเปลี่ยนไป เปิดหน้าใหม่อีกครั้ง",
  unavailable: "เชื่อมต่อไม่ได้ชั่วคราว",
  timeout: "รอนานเกินไป อาจออฟไลน์อยู่"
};
const errText = e => ERR_TEXT[e && e.code] || "บันทึกไม่สำเร็จ";
const sleep = ms => new Promise(r => setTimeout(r, ms));
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout", message: "timeout" }), ms))]);
}
async function track(label, fn) {
  if (!writable()) { toast("บัญชีนี้ดูได้อย่างเดียว"); return false; }
  Sync.pending++; notify("sync");
  try {
    try { await fn(); }
    catch (e) {
      if (e && e.code === "unavailable") { await sleep(500 + Math.random() * 1000); await fn(); }
      else throw e;
    }
    Sync.lastOk = now();
    return true;
  } catch (e) {
    if (e && e.code === "invalid_argument" && Store.canWrite == null) Store.canWrite = false; // platform hadn't said; the store did
    if (e && e.code === "revoked") Store.revoked = true;
    Sync.failed.push({ id: newId(), label, fn, error: e, at: now() });
    toast(label + " ไม่สำเร็จ: " + errText(e));
    return false;
  } finally {
    Sync.pending--; notify("sync");
  }
}
async function retryFailed(id) {
  const f = Sync.failed.find(x => x.id === id); if (!f) return;
  Sync.failed = Sync.failed.filter(x => x.id !== id);
  await track(f.label, f.fn);
}
function syncState() {
  if (Store.mode === "loading") return { state: "saving", text: "กำลังโหลด…" };
  if (Store.mode === "cloud") {
    if (Sync.failed.length) return { state: "error", text: `บันทึกไม่สำเร็จ ${Sync.failed.length} รายการ` };
    const n = Store.db.pending ? Store.db.pending() : 0;
    if (n) return navigator.onLine ? { state: "saving", text: `กำลังส่ง ${n} รายการ…` } : { state: "offline", text: `ออฟไลน์ รอส่ง ${n} รายการ` };
    if (!navigator.onLine) return { state: "offline", text: "ออฟไลน์ ใช้ข้อมูลที่เก็บไว้" };
    if (Cloud.realtime !== "SUBSCRIBED") return { state: "stale", text: "กำลังเชื่อมต่อวง…" };
    if (Store.canWrite === false) return { state: "readonly", text: "ผู้ดู · ซิงก์กับวงแล้ว" };
    return { state: "ok", text: "ซิงก์กับวงแล้ว" };
  }
  if (Store.mode === "device") {
    if (Sync.failed.length) return { state: "error", text: `บันทึกไม่สำเร็จ ${Sync.failed.length} รายการ` };
    return { state: "local", text: Sync.pending ? "กำลังบันทึก…" : "เก็บในเครื่องนี้" };
  }
  if (Store.revoked) return { state: "error", text: "สิทธิ์เปลี่ยน เปิดหน้าใหม่" };
  if (Sync.failed.length) return { state: "error", text: `บันทึกไม่สำเร็จ ${Sync.failed.length} รายการ` };
  if (Sync.pending) return navigator.onLine ? { state: "saving", text: "กำลังบันทึก…" } : { state: "offline", text: `ออฟไลน์ รอส่ง ${Sync.pending} รายการ` };
  if (!navigator.onLine) return { state: "offline", text: "ออฟไลน์ ข้อมูลอาจไม่ล่าสุด" };
  if (Store.slow && !Store.fresh) return { state: "stale", text: "ยังโหลดข้อมูลล่าสุดไม่ได้" };
  if (Store.canWrite === false) return { state: "readonly", text: "ดูอย่างเดียว" };
  return { state: "ok", text: Sync.lastOk ? "บันทึกแล้ว" : "ข้อมูลล่าสุด" };
}

/* ---------- songs ---------- */
const SONG_FIELDS = ["title", "artist", "bpm", "blocks", "source", "sourceCheck", "musicCheck", "notes"];
function songBody(song, rev) {
  const body = {};
  for (const k of SONG_FIELDS) if (song[k] !== undefined) body[k] = song[k];
  body.title = String(body.title || "").trim();
  body.artist = String(body.artist || "").trim();
  body.rev = rev; body.updatedAt = now(); body.updatedBy = Store.me.id || null;
  if (!song.createdAt) body.createdAt = now(); else body.createdAt = song.createdAt;
  return body;
}
/** Save a song. For an existing song, first checks nobody else saved it since `baseRev` was loaded.
 *  Resolves {ok} | {conflict: theirSong|null (deleted)} | {unchecked: true} (couldn't reach the store to check). */
async function saveSong(song, baseRev, { force = false } = {}) {
  if (!writable()) return { ok: false };
  const id = song.id || newId();
  const ref = Store.db.doc("songs/" + id);
  let rev = 1;
  if (song.id && baseRev != null) {
    try { await withTimeout(ref.acquire({ holder: TAB, ttlMs: 8000 }), 4000); } catch (e) { /* lease is advisory */ }
    let cur;
    try { cur = await withTimeout(ref.get(), 6000); }
    catch (e) { if (!force) return { unchecked: true }; }
    if (cur && cur.metadata && cur.metadata.fromCache && !force) return { unchecked: true };   // offline copy: can't tell if someone else saved
    if (cur && !force) {
      if (!cur.exists) return { conflict: null };
      const theirRev = (cur.data() || {}).rev || 0;
      if (theirRev !== baseRev) return { conflict: { ...cur.data(), id } };
    }
    rev = Math.max(baseRev, cur && cur.exists ? (cur.data().rev || 0) : 0) + 1;
    const before = cur && cur.exists ? { ...cur.data(), id } : Store.songs.get(id);
    if (before) await keepHistory("song", id, before, "edit");
  }
  const body = songBody({ ...song, id }, rev);
  const label = "บันทึกเพลง “" + body.title + "”";
  if (ref.putIfRev && song.id && baseRev != null && !force && navigator.onLine) {
    // the server compares the revision and writes in one step, so a save that raced ours cannot be lost
    let conflict = null;
    const ok = await track(label, async () => {
      try { await ref.putIfRev(body, rev - 1); }
      catch (e) { if (e && e.code === "conflict") { conflict = e; return; } throw e; }
    });
    if (conflict) return { conflict: conflict.current ? { ...conflict.current, id } : null };
    return ok ? { ok: true, id, rev } : { ok: false, id };
  }
  const ok = await track(label, () => ref.set(body));
  return ok ? { ok: true, id, rev } : { ok: false, id };
}
async function patchSong(id, patch) {
  const ref = Store.db.doc("songs/" + id);
  return track("บันทึกเพลง", () => ref.update({ ...patch, updatedAt: now(), updatedBy: Store.me.id || null }));
}
async function deleteSong(id, removeItems) {
  const items = [...Store.items.values()].filter(i => i.songId === id);
  const before = Store.songs.get(id);
  if (before) await keepHistory("song", id, before, "delete", { items: removeItems ? items : [] });
  if (removeItems) for (const it of items) await track("เอาเพลงออกจากงาน", () => Store.db.doc("items/" + it.id).delete());
  return track("ลบเพลง", () => Store.db.doc("songs/" + id).delete());
}

/* ---------- events, sets, items ---------- */
const EVENT_FIELDS = ["name", "date", "venue", "note", "slotMinutes", "gapSeconds"];
async function createEvent(fields) {
  const id = newId();
  const body = { ...pick(fields, EVENT_FIELDS), sets: fields.sets || [{ id: newId(), name: "เซ็ตหลัก" }], createdAt: now(), updatedAt: now(), updatedBy: Store.me.id || null, setsRev: 1 };
  const ok = await track("สร้างงาน", () => Store.db.doc("events/" + id).set(body));
  return ok ? id : null;
}
function pick(o, keys) { const r = {}; for (const k of keys) if (o[k] !== undefined) r[k] = o[k]; return r; }
async function updateEvent(id, fields) {
  return track("บันทึกงาน", () => Store.db.doc("events/" + id).update({ ...pick(fields, EVENT_FIELDS), updatedAt: now(), updatedBy: Store.me.id || null }));
}
/** Change the list of sets with a check that nobody else changed it meanwhile. mutate(sets) returns the new array. */
async function changeSets(eventId, mutate) {
  const ref = Store.db.doc("events/" + eventId);
  try { await withTimeout(ref.acquire({ holder: TAB, ttlMs: 6000 }), 3000); } catch (e) { /* advisory */ }
  let cur;
  try { cur = await withTimeout(ref.get(), 6000); } catch (e) { toast("เชื่อมต่อไม่ได้ ยังแก้รายการเซ็ตไม่ได้"); return false; }
  if (!cur.exists) { toast("งานนี้ถูกลบไปแล้ว"); return false; }
  const data = cur.data();
  const sets = mutate((data.sets || []).map(s => ({ ...s })));
  if (!sets) return false;
  return track("บันทึกเซ็ต", () => ref.update({ sets, setsRev: (data.setsRev || 0) + 1, updatedAt: now(), updatedBy: Store.me.id || null }));
}
async function deleteEvent(id) {
  const before = Store.events.get(id);
  if (before) await keepHistory("event", id, before, "delete", { items: eventItems(id) });
  for (const it of eventItems(id)) await track("ลบรายการเพลง", () => Store.db.doc("items/" + it.id).delete());
  return track("ลบงาน", () => Store.db.doc("events/" + id).delete());
}
async function duplicateEvent(id) {
  const ev = Store.events.get(id); if (!ev) return null;
  const nid = await createEvent({ ...ev, name: ev.name + " (สำเนา)", sets: (ev.sets || []).map(s => ({ ...s })) });
  if (!nid) return null;
  for (const it of eventItems(id)) {
    const body = { ...pick(it, ITEM_FIELDS), eventId: nid, updatedAt: now() };
    await track("คัดลอกรายการเพลง", () => Store.db.doc("items/" + newId()).set(body));
  }
  return nid;
}
const ITEM_FIELDS = ["eventId", "setId", "songId", "order", "shift", "capo", "bpm", "singer", "note", "kind", "minutes", "label", "durationSec"];
async function addItems(eventId, setId, songIds) {
  let order = Math.max(0, ...setItems(eventId, setId).map(i => i.order || 0));
  let ok = true;
  const created = [];
  for (const songId of songIds) {
    order += 1000;
    const id = newId();
    const body = { eventId, setId, songId, order, shift: 0, capo: 0, bpm: null, singer: "", note: "", updatedAt: now(), updatedBy: Store.me.id || null };
    const done = await track("เพิ่มเพลงเข้าเซ็ต", () => Store.db.doc("items/" + id).set(body));
    if (done) created.push(id);
    ok = done && ok;
  }
  if (created.length) pushUndo(`เพิ่ม ${created.length} เพลงแล้ว`, async () => { let r = true; for (const id of created) r = (await removeItem(id)) && r; return r; });
  return ok;
}
async function patchItem(id, patch) {
  return track("บันทึกค่าของเพลงในงาน", () => Store.db.doc("items/" + id).update({ ...patch, updatedAt: now(), updatedBy: Store.me.id || null }));
}
const removeItem = id => track("เอาเพลงออกจากเซ็ต", () => Store.db.doc("items/" + id).delete());
/** Move an item to `setId`, just before `beforeId` (or to the end). Writes only the moved item,
 *  unless the gap between neighbours has run out, then renumbers that set once. */
async function moveItem(itemId, eventId, setId, beforeId) {
  const list = setItems(eventId, setId).filter(i => i.id !== itemId);
  const idx = beforeId ? list.findIndex(i => i.id === beforeId) : list.length;
  const prev = list[idx - 1], next = list[idx];
  let order;
  if (!prev && !next) order = 1000;
  else if (!prev) order = next.order - 1000;
  else if (!next) order = prev.order + 1000;
  else order = (prev.order + next.order) / 2;
  if (prev && next && Math.abs(next.order - prev.order) < 1e-6) {
    const all = [...list.slice(0, idx), { id: itemId }, ...list.slice(idx)];
    let ok = true;
    for (let k = 0; k < all.length; k++) ok = (await patchItem(all[k].id, { setId, order: (k + 1) * 1000 })) && ok;
    return ok;
  }
  return patchItem(itemId, { setId, order });
}

/* ---------- starter songs ---------- */
async function seedBuiltin(quiet) {
  let ok = true;
  for (const s of BUILTIN.songs) {
    if (Store.songs.has(s.id)) continue;
    ok = (await track("นำเข้าเพลง " + s.title, () => Store.db.doc("songs/" + s.id).set(songBody(s, 1)))) && ok;
  }
  for (const e of BUILTIN.events) {
    if (Store.events.has(e.id)) continue;
    const body = { ...pick(e, EVENT_FIELDS), sets: e.sets, setsRev: 1, createdAt: now(), updatedAt: now(), updatedBy: Store.me.id || null };
    ok = (await track("นำเข้างาน " + e.name, () => Store.db.doc("events/" + e.id).set(body))) && ok;
    for (const it of BUILTIN.items.filter(i => i.eventId === e.id)) {
      if (Store.items.has(it.id)) continue;
      const ib = { ...pick(it, ITEM_FIELDS), updatedAt: now() };
      ok = (await track("นำเข้ารายการเพลง", () => Store.db.doc("items/" + it.id).set(ib))) && ok;
    }
  }
  return ok;
}

/* ---------- history, trash, restore ----------
   Before a song is overwritten or a song/gig is deleted, its previous state is copied to history/{id}
   (with the gig rows it took along). The last 30 versions per song are kept. Restoring writes the old
   state back as a new revision, so restoring is itself undoable. */
const HISTORY_KEEP = 30;
const plain = o => { const r = JSON.parse(JSON.stringify(o || {})); delete r.id; return r; };
async function keepHistory(kind, refId, data, action, extra) {
  const body = { kind, refId, action, rev: (data && data.rev) || 0, title: (data && (data.title || data.name)) || "", data: plain(data),
    extra: extra ? { items: (extra.items || []).map(i => ({ ...plain(i), id: i.id })) } : null, at: now(), by: Store.me.id || null };
  const ok = await track("เก็บประวัติ", () => Store.db.doc("history/" + newId()).set(body));
  if (ok) pruneHistory(kind, refId);
  return ok;
}
async function historyList(filter) {
  try {
    const snap = await withTimeout(Store.db.collection("history").get(), 8000);
    return snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(filter || (() => true)).sort((a, b) => b.at - a.at);
  } catch (e) { toast("โหลดประวัติไม่ได้: " + errText(e)); return null; }
}
async function pruneHistory(kind, refId) {
  const list = await historyList(h => h.kind === kind && h.refId === refId && h.action === "edit");
  if (!list) return;
  for (const h of list.slice(HISTORY_KEEP)) await track("ล้างประวัติเก่า", () => Store.db.doc("history/" + h.id).delete());
}
/** Deleted songs and gigs that are not back yet, newest first. */
async function trashList() {
  const list = await historyList(h => h.action === "delete");
  if (!list) return null;
  const seen = new Set();
  return list.filter(h => {
    const key = h.kind + ":" + h.refId;
    if (seen.has(key)) return false;
    seen.add(key);
    return !(h.kind === "song" ? Store.songs.has(h.refId) : Store.events.has(h.refId));
  });
}
async function restoreHistory(h) {
  if (h.kind === "song") {
    const cur = Store.songs.get(h.refId);
    if (cur) {
      const r = await saveSong({ ...h.data, id: h.refId, createdAt: cur.createdAt }, cur.rev || 0, { force: true });
      return !!(r && r.ok);
    }
    const body = { ...h.data, rev: (h.rev || 0) + 1, updatedAt: now(), updatedBy: Store.me.id || null };
    let ok = await track("กู้เพลง " + (h.title || ""), () => Store.db.doc("songs/" + h.refId).set(body));
    for (const it of (h.extra && h.extra.items) || []) {
      if (!Store.events.has(it.eventId) || Store.items.has(it.id)) continue;
      const { id, ...ib } = it;
      ok = (await track("คืนเพลงเข้างาน", () => Store.db.doc("items/" + id).set(ib))) && ok;
    }
    return ok;
  }
  const body = { ...h.data, updatedAt: now(), updatedBy: Store.me.id || null };
  let ok = await track("กู้งาน " + (h.title || ""), () => Store.db.doc("events/" + h.refId).set(body));
  for (const it of (h.extra && h.extra.items) || []) {
    if (Store.items.has(it.id) || (!isBreak(it) && !Store.songs.has(it.songId))) continue;
    const { id, ...ib } = it;
    ok = (await track("คืนรายการเพลง", () => Store.db.doc("items/" + id).set(ib))) && ok;
  }
  return ok;
}
async function purgeHistory(h) {
  const all = await historyList(x => x.kind === h.kind && x.refId === h.refId);
  for (const x of all || []) await track("ลบถาวร", () => Store.db.doc("history/" + x.id).delete());
}

/* ---------- undo for gig edits ----------
   Reordering, moving, adding, removing and resetting rows push an undo step. The toast offers
   “ย้อนกลับ”, and Ctrl/⌘+Z on the gig page undoes the latest step. */
const undoStack = [];
function pushUndo(label, revert) {
  undoStack.push({ label, revert, at: now() });
  if (undoStack.length > 30) undoStack.shift();
  toast(label, 8000, { text: "ย้อนกลับ", run: undoLast });
}
async function undoLast() {
  const u = undoStack.pop();
  if (!u) { toast("ไม่มีอะไรให้ย้อนกลับ"); return; }
  const ok = await u.revert();
  toast(ok === false ? "ย้อนกลับไม่สำเร็จ ดูที่ปุ่มสถานะ" : "ย้อนกลับแล้ว: " + u.label);
}
const rowState = it => ({ setId: it.setId, order: it.order });
async function moveItemUndoable(itemId, eventId, setId, beforeId, label = "ย้ายเพลงแล้ว") {
  const it = Store.items.get(itemId); if (!it) return false;
  const before = rowState(it);
  const ok = await moveItem(itemId, eventId, setId, beforeId);
  if (ok) pushUndo(label, () => patchItem(itemId, before));
  return ok;
}
async function patchItemUndoable(itemId, patch, label = "บันทึกแล้ว") {
  const it = Store.items.get(itemId); if (!it) return false;
  const before = {};
  for (const k of Object.keys(patch)) before[k] = it[k] === undefined ? null : it[k];
  const ok = await patchItem(itemId, patch);
  if (ok) pushUndo(label, () => patchItem(itemId, before));
  return ok;
}
async function removeItemUndoable(itemId) {
  const it = Store.items.get(itemId); if (!it) return false;
  const { id, ...body } = it;
  const ok = await removeItem(itemId);
  if (ok) pushUndo("เอาออกจากเซ็ตแล้ว", () => track("คืนเพลงเข้าเซ็ต", () => Store.db.doc("items/" + id).set(body)));
  return ok;
}
async function addBreak(eventId, setId, minutes, label) {
  const order = Math.max(0, ...setItems(eventId, setId).map(i => i.order || 0)) + 1000;
  const id = newId();
  const ok = await track("เพิ่มช่วงพัก", () => Store.db.doc("items/" + id).set({ eventId, setId, kind: "break", minutes, label: label || "พัก", order, updatedAt: now(), updatedBy: Store.me.id || null }));
  if (ok) pushUndo("เพิ่มช่วงพักแล้ว", () => removeItem(id));
  return ok;
}

function toast(msg, ms = 3200, action) {
  let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "toast-act"; b.textContent = action.text;
