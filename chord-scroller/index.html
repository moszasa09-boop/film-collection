/* readiness chips for a song */
function songChips(song, { bpm, shift = 0, capo = 0 } = {}) {
  if (!song) return `<span class="chip bad">ไม่พบเพลง (ถูกลบ)</span>`;
  const st = songStats(song);
  const out = [];
  const key = keyOf(song.blocks, shift);
  if (key) out.push(`<span class="chip key" title="คีย์">${esc(key)}</span>`);
  if (capo) out.push(`<span class="chip">คาโป้ ${capo}</span>`);
  out.push(`<span class="chip">${bpm || song.bpm || 80} BPM</span>`);
  if (st.unclear) out.push(`<span class="chip warn">อ่านไม่ชัด ${st.unclear} จุด</span>`);
  else if (!st.chords) out.push(`<span class="chip bad">ไม่มีคอร์ด</span>`);
  else if (!st.lyricLines) out.push(`<span class="chip warn">ไม่มีเนื้อร้อง</span>`);
  if (song.musicCheck === "checked") out.push(`<span class="chip ok">ตรวจกับเพลงจริงแล้ว</span>`);
  else if (song.sourceCheck === "matched") out.push(`<span class="chip">ตรงต้นฉบับ · ยังไม่ตรวจกับเพลงจริง</span>`);
  else out.push(`<span class="chip warn">ยังไม่ได้ตรวจ</span>`);
  return out.join("");
}

/* ---------- dialogs ----------
   openDialog(html, onMount) shows a sheet; returns {close, el}. Escape and the scrim close it unless
   the dialog says it holds unsaved input (data-dirty), in which case it asks first. */
let dialogStack = [];
function openDialog(html, onMount, { label = "" } = {}) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet-dlg" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  document.body.appendChild(scrim);
  const el = $(".sheet-dlg", scrim);
  const prevFocus = document.activeElement;
  const api = {
    el,
    close() {
      scrim.remove();
      dialogStack = dialogStack.filter(d => d !== api);
      if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) { /* element gone */ }
    },
    async tryClose() {
      if (el.dataset.dirty === "1" && !(await confirmDialog("ปิดโดยไม่บันทึก?", "สิ่งที่พิมพ์ในหน้าต่างนี้จะหายไป", "ปิดโดยไม่บันทึก", true))) return;
      api.close();
    }
  };
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) api.tryClose(); });
  dialogStack.push(api);
  if (onMount) onMount(el, api);
  const first = el.querySelector("[autofocus], input, select, textarea, button");
  if (first) first.focus();
  return api;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && dialogStack.length) { e.preventDefault(); dialogStack[dialogStack.length - 1].tryClose(); }
});
function confirmDialog(title, body, okText = "ตกลง", danger = false) {
  return new Promise(resolve => {
    openDialog(`<h2>${esc(title)}</h2>${body ? `<p class="muted" style="margin:0">${esc(body)}</p>` : ""}
      <div class="actions"><button class="btn ghost" data-a="no" type="button">ยกเลิก</button>
      <button class="btn ${danger ? "danger" : "primary"}" data-a="yes" type="button">${esc(okText)}</button></div>`,
      (el, d) => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const orig = d.close; d.close = () => { orig(); finish(false); };   // Escape / scrim = no
        el.addEventListener("click", e => {
          const a = e.target.closest("[data-a]"); if (!a) return;
          finish(a.dataset.a === "yes"); d.close();
        });
      }, { label: title });
  });
}
function openFailedDialog() {
  openDialog(`<h2>บันทึกไม่สำเร็จ</h2>
    <p class="muted" style="margin:0">รายการเหล่านี้ยังไม่ได้ถูกบันทึก กด “ลองใหม่” เมื่อเชื่อมต่อได้ หรือ “ทิ้ง” ถ้าไม่ต้องการแล้ว</p>
    <ul class="issues">${Sync.failed.map(f => `<li class="err">${esc(f.label)} · ${esc(errText(f.error))} · ${esc(fmtAgo(f.at))}
      <button class="btn" data-retry="${f.id}" type="button">ลองใหม่</button><button class="btn ghost" data-drop="${f.id}" type="button">ทิ้ง</button></li>`).join("")}</ul>
    <div class="actions"><button class="btn" data-a="close" type="button">ปิด</button></div>`, (el, d) => {
    el.addEventListener("click", async e => {
      const r = e.target.closest("[data-retry]"), x = e.target.closest("[data-drop]");
      if (r) { d.close(); await retryFailed(r.dataset.retry); }
      else if (x) { Sync.failed = Sync.failed.filter(f => f.id !== x.dataset.drop); d.close(); notify("sync"); }
      else if (e.target.closest('[data-a="close"]')) d.close();
    });
  }, { label: "บันทึกไม่สำเร็จ" });
}

        .map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${libFilter === k}">${t}</button>`).join("")}

function lyricText(s) { return (s.blocks || []).filter(b => b.type === "lines").map(b => b.lines.map(l => l.map(x => x[1]).join("")).join(" ")).join(" "); }
function renderLibList() {
  const box = $("#lib-list"); if (!box) return;
  if (Store.mode === "shared" && !Store.loaded.songs) { box.innerHTML = `<p class="empty">กำลังโหลดเพลง…</p>`; return; }
  const nq = norm(libQuery);
  const list = songList().filter(s => {
    if (nq && !norm(s.title + s.artist).includes(nq) && !norm(lyricText(s)).includes(nq)) return false;
    const st = songStats(s);
    if (libFilter === "unclear") return st.unclear > 0;
    if (libFilter === "unchecked") return s.musicCheck !== "checked";
    if (libFilter === "checked") return s.musicCheck === "checked";
    if (libFilter === "unused") return !usageOf(s.id).size;
    return true;
  });
  box.innerHTML = `<p class="small muted">${list.length} เพลง</p>` + (list.length ? `<div class="list">${list.map(songRow).join("")}</div>` : `<p class="empty">${Store.songs.size ? "ไม่พบเพลงที่ตรงกับคำค้นหรือตัวกรอง" : "คลังยังว่าง เพิ่มเพลงจากรูปหรือข้อความได้เลย"}</p>`);
}

      <span>พร้อมเล่น <b>${sum.ready}/${sum.count}</b></span><span>ตรวจกับเพลงจริง <b>${sum.checked}/${sum.count}</b></span></div>

function breakRow(it, w) {
  return `<div class="item-row break-row" data-item="${esc(it.id)}">
    ${w ? `<button class="handle" type="button" data-drag="${esc(it.id)}" aria-label="ลากเพื่อเรียงลำดับ">${ICON.grip}</button>` : `<span class="n">–</span>`}

  </div>`;

/* ---------- ready for the stage? ---------- */
function readinessIssues(ev, all) {
  const out = [];
  const songs = all.filter(i => !isBreak(i));
  if (!songs.length) out.push({ level: "bad", text: "ยังไม่มีเพลงในงาน" });
  const sum = summarize(all, ev);
  if (ev.slotMinutes && sum.secs > ev.slotMinutes * 60) out.push({ level: "bad", text: `เวลารวม ${fmtTime(sum.secs)} เกินเวลางาน ${ev.slotMinutes} นาที` });
  songs.forEach((it, i) => {
    const s = Store.songs.get(it.songId), n = `${i + 1}. ${s ? s.title : "เพลงถูกลบ"}`;
    if (!s) { out.push({ level: "bad", text: n + ": เพลงถูกลบจากคลัง", item: it.id }); return; }
    const st = songStats(s);
    if (!st.lyricLines) out.push({ level: "bad", text: n + ": ไม่มีเนื้อร้อง", song: s.id });
    if (!st.chords) out.push({ level: "bad", text: n + ": ไม่มีคอร์ด", song: s.id });
    if (st.unclear) out.push({ level: "warn", text: `${n}: อ่านไม่ชัด ${st.unclear} จุด`, song: s.id });
    if (s.musicCheck !== "checked") out.push({ level: "info", text: n + ": ยังไม่ตรวจกับเพลงจริง", song: s.id });
    if (!it.singer) out.push({ level: "info", text: n + ": ยังไม่กำหนดนักร้อง", item: it.id });
    if (!validBpm(it.bpm) && !validBpm(s.bpm)) out.push({ level: "info", text: n + ": ยังไม่ตั้ง BPM (ใช้ 80)", item: it.id });
  });
  const off = typeof offlineStatus === "function" ? offlineStatus(ev.id) : null;
  if (off && !off.ready) out.push({ level: "info", text: off.text, offline: true });
  return out;
}
function readinessPanel(ev, all) {
  const list = readinessIssues(ev, all);
  const bad = list.filter(x => x.level === "bad").length, warn = list.filter(x => x.level === "warn").length, info = list.filter(x => x.level === "info").length;
  const head = !list.length ? `<span class="chip ok">พร้อมขึ้นเวที</span>` :
    `${bad ? `<span class="chip bad">ต้องแก้ ${bad}</span>` : ""}${warn ? `<span class="chip warn">ควรตรวจ ${warn}</span>` : ""}${info ? `<span class="chip">ยังไม่ครบ ${info}</span>` : ""}`;
  const w = writable();
  return `<details class="ready" ${bad || warn ? "open" : ""}><summary><b>ตรวจความพร้อมก่อนขึ้นเวที</b> ${head}</summary>
    ${list.length ? `<ul class="issues">${list.map(x => `<li class="${x.level === "bad" ? "err" : x.level === "warn" ? "warn" : ""}">${esc(x.text)}
      ${w && x.song ? ` <a href="#edit-${esc(x.song)}">แก้เพลง</a>` : ""}${w && x.item ? ` <button class="btn ghost" type="button" data-itemmenu="${esc(x.item)}">ตั้งค่า</button>` : ""}${x.offline ? ` <button class="btn ghost" type="button" data-offline="${esc(ev.id)}">เตรียมออฟไลน์</button>` : ""}</li>`).join("")}</ul>`

  </details>`;
}

/* ---------- drag to reorder (mouse, touch, pen) ---------- */
function startDrag(e, itemId, eventId) {
  if (e.button > 0) return;
  e.preventDefault();
  const row = e.target.closest(".item-row");
  const it = Store.items.get(itemId); const s = it && Store.songs.get(it.songId);
  dragActive = true;
  row.classList.add("dragging");
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost"; ghost.textContent = s ? s.title : "เพลง";
  document.body.appendChild(ghost);
  const line = document.createElement("div"); line.className = "drop-line";
  let target = null, scrollTimer = 0, lastY = e.clientY;
  const place = (x, y) => {
    ghost.style.transform = `translate(${x + 12}px, ${y - 20}px)`;
    const under = document.elementFromPoint(x, y);
    $$(".set.drop-target").forEach(el => el.classList.remove("drop-target"));
    const set = under && under.closest(".set[data-set]");
    if (!set) { line.remove(); target = null; return; }
    set.classList.add("drop-target");
    const listEl = $("[data-list]", set);
    const rows = $$(".item-row[data-item]", listEl).filter(r => r.dataset.item !== itemId);
    let before = null;
    for (const r of rows) { const b = r.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = r; break; } }
    if (before) listEl.insertBefore(line, before); else listEl.appendChild(line);
    target = { setId: set.dataset.set, beforeId: before ? before.dataset.item : null };
  };
  const autoscroll = () => {
    const edge = 70, h = window.innerHeight;
    if (lastY < edge) window.scrollBy(0, -12); else if (lastY > h - edge) window.scrollBy(0, 12);
  };
  scrollTimer = setInterval(autoscroll, 30);
  place(e.clientX, e.clientY);
  const move = ev => { lastY = ev.clientY; place(ev.clientX, ev.clientY); };
  const end = async ev => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
    clearInterval(scrollTimer);
    ghost.remove(); line.remove(); row.classList.remove("dragging");
    $$(".set.drop-target").forEach(el => el.classList.remove("drop-target"));
    dragActive = false;
    const t = ev.type === "pointerup" ? target : null;
    if (t) {
      const list = setItems(eventId, t.setId).map(i => i.id);
      const curIdx = list.indexOf(itemId), nextId = curIdx >= 0 ? list[curIdx + 1] || null : undefined;
      const unchanged = it.setId === t.setId && (t.beforeId === nextId);
      if (!unchanged) await moveItemUndoable(itemId, eventId, t.setId, t.beforeId, "ย้ายเพลงแล้ว");
    }
    if (renderAfterDrag || t) { renderAfterDrag = false; route(); }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
}

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && currentRoute && currentRoute.name === "event" && !dialogStack.length && !inside(e.target, "input, textarea, select")) {

/** Big photos are cut into overlapping bands so small print survives the ~1.2-megapixel limit. */
async function prepareImages(files, maxCount) {
  const out = [];
  const bitmaps = [];
  for (const f of files) {
    try { bitmaps.push({ f, bmp: await createImageBitmap(f) }); } catch (e) { bitmaps.push({ f, bmp: null }); }
  }
  let budget = maxCount - files.length;
  for (const { f, bmp } of bitmaps) {
    if (!bmp) { out.push(f); continue; }
    const mp = bmp.width * bmp.height / 1e6;
    const want = Math.min(4, Math.ceil(mp / 1.2));
    if (want <= 1 || budget < want - 1) { out.push(f); continue; }
    budget -= want - 1;
    const tall = bmp.height >= bmp.width;
    const len = tall ? bmp.height : bmp.width, step = len / want, ov = Math.round(step * 0.06);
    for (let k = 0; k < want; k++) {
      const a = Math.max(0, Math.round(k * step) - ov), b = Math.min(len, Math.round((k + 1) * step) + ov);
      const c = document.createElement("canvas");
      c.width = tall ? bmp.width : b - a; c.height = tall ? b - a : bmp.height;
      c.getContext("2d").drawImage(bmp, tall ? 0 : a, tall ? a : 0, c.width, c.height, 0, 0, c.width, c.height);
      out.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.92)));
    }
  }
  return out;
}

  } catch (e) {
    const code = e && e.code;
    const msg = {
      cancelled: "หยุดอ่านแล้ว", not_granted: "ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude", sampling_disabled: "บัญชีนี้ใช้ Claude อ่านรูปไม่ได้",
      images_unavailable: "หน้านี้ส่งรูปไม่ได้ในตอนนี้", image_rejected: "รูปนี้ใช้ไม่ได้ (ชนิดไฟล์หรือขนาดไม่รองรับ) ลองรูปอื่น",
      rate_limited: "ใช้งานถี่เกินไปหรือโควตาหมด ลองใหม่ภายหลัง", not_configured: "เจ้าของวงยังไม่ได้ใส่คีย์ Anthropic ใน Supabase (Edge Functions → Secrets)", not_signed_in: "เข้าสู่ระบบใหม่อีกครั้ง", invalid_json: "ผลที่อ่านได้อยู่ในรูปแบบที่ใช้ไม่ได้ กดอ่านใหม่อีกครั้ง",
      refused: "Claude ไม่อ่านรูปนี้ ลองรูปอื่น", session_expired: "ต้องเข้าสู่ระบบ claude.ai ใหม่", empty_completion: "ไม่ได้ผลลัพธ์ ลองครอปรูปให้เหลือแค่ชีทคอร์ด"
    }[code] || "อ่านไม่สำเร็จ ลองใหม่อีกครั้ง";

  } finally {

}

/* ---------- the player ----------
   Plays one song, either inside a gig (with that gig's key, capo, BPM, singer and note, and previous/next
   in set order) or straight from the library. The sheet holds still and steps one line at a time,
   timed by BPM; a one-bar count-in starts it. Scrolling by hand pauses the clock and it resumes from the
   line at the playhead. */
const P = {
  key: "", ctx: null, parts: [], bpm: 80, shift: 0, capo: 0,
  playing: false, countBeats: 0, countStart: 0, elapsed: 0, lastT: 0,
  rows: [], tops: [], starts: [], total: 0, cur: 0,
  userScrolling: false, userTimer: 0, autoScrollUntil: 0, dragging: false, wakeLock: null, taps: [],
  paintedCur: -1, paintedSec: -1, saveTimer: 0, pendingSave: null, songRev: null, itemSig: "", ended: false
};
const pActive = () => !!P.ctx && !!$("#sheet.player-sheet");
let fontScale = 1;

/* ---------- shared sheet rendering (player and editor preview) ---------- */
function chordHTML(c, s) {
  if (!c) return "&nbsp;";
  const shown = tr(c.replace(/\?$/, ""), s);
  return isUnclearChord(c) ? `<span class="unclear" title="อ่านไม่ชัด">${esc(shown)}?</span>` : esc(shown);
}
function lyricHTML(t) {
  return esc(t || "").replace(/\{\?([^}]*)\}/g, (m, w) => `<span class="unclear" title="อ่านไม่ชัด">${w || "?"}</span>`);
}
function segHTML(line, s, attrs) {
  const hasChord = line.some(([c]) => c);
  const hasText = line.some(([, t]) => t && t.trim());
  const cls = !hasChord ? "nochord" : !hasText ? "onlychord" : "";
  return `<div class="line lyr ${cls}" ${attrs}>` + line.map(([c, t]) =>
    `<span class="seg"><span class="ch">${chordHTML(c, s)}</span><span class="ly">${lyricHTML(t)}</span></span>`).join("") + `</div>`;
}
function sheetHTML(parts, s) {
  return parts.map((p, pi) => {
    const b = p.block;
    if (p.kind === "instru") return `<div class="line instru" data-p="${pi}" data-bars="${p.bars}"><span class="lab">${esc(p.name)}</span><span class="bars">${(b.bars || []).map(bar => `<span>${bar.split(/\s+/).map(c => chordHTML(c, s)).join(" ")}</span>`).join("")}</span>${b.note ? `<span class="note">${esc(b.note)}</span>` : ""}</div>`;
    if (p.kind === "lines") return `<div class="stanza"><div class="sec" data-sec="${pi}">${esc(p.name)}</div>${p.lines.map(l => segHTML(l.line, s, `data-p="${pi}" data-bars="${l.bars}"`)).join("")}</div>`;
    if (p.kind === "note") return `<div class="line notel" data-p="${pi}" data-bars="0">${esc(b.text)}</div>`;
    if (p.kind === "end") return `<div class="line endl" data-p="${pi}" data-bars="0">${esc(b.text)}</div>`;
    return "";
  }).join("");
}

/* ---------- context ---------- */
function playerContext(kind, a, b) {
  if (kind === "event") {
    const ev = Store.events.get(a), item = Store.items.get(b);
    if (!ev || !item) return null;
    if (isBreak(item)) return null;
    const full = eventItems(a), list = full.filter(i => !isBreak(i));
    return { kind, event: ev, item, song: Store.songs.get(item.songId), list, full, index: list.findIndex(i => i.id === b) };
  }
  const song = Store.songs.get(a);
  return song ? { kind: "song", song, event: null, item: null, list: [], index: -1 } : null;
}
const itemSig = it => it ? [it.shift || 0, it.capo || 0, it.bpm || "", it.singer || "", it.note || "", it.setId].join("|") : "";
function settingsFrom(ctx) {
  if (ctx.item) return { bpm: itemBpm(ctx.item, ctx.song), shift: ctx.item.shift || 0, capo: ctx.item.capo || 0 };
  const lib = prefs.get("lib:" + ctx.song.id, {});
  return { bpm: validBpm(ctx.song.bpm) ? ctx.song.bpm : 80, shift: lib.shift || 0, capo: lib.capo || 0 };
}

function renderPlayer(kind, a, b) {
  const key = kind + ":" + a + ":" + (b || "");
  const ctx = playerContext(kind, a, b);
  if (!ctx || !ctx.song) {
    stopPlay();
    P.ctx = null; P.key = "";
    const back = kind === "event" ? "#event-" + a : "#library";
    app.innerHTML = header({ title: "เล่นเพลง", back }) + `<main class="wrap"><p class="empty">${Store.fresh || Store.mode === "device" ? (ctx && !ctx.song ? "เพลงนี้ถูกลบออกจากคลังแล้ว" : "ไม่พบเพลงนี้ อาจถูกลบหรือย้ายไปแล้ว") : "กำลังโหลด…"}</p><p style="text-align:center"><a class="btn" href="${back}">กลับ</a></p></main>`;
    return;
  }
  // same song still on screen: refresh in place instead of rebuilding (keeps the position while playing)
  if (P.key === key && pActive()) {
    const songChanged = (ctx.song.rev || 0) !== P.songRev;
    const itemChanged = itemSig(ctx.item) !== P.itemSig && !P.pendingSave;
    P.ctx = ctx;
    if (itemChanged) { const st = settingsFrom(ctx); P.bpm = st.bpm; P.shift = st.shift; P.capo = st.capo; P.itemSig = itemSig(ctx.item); }
    if (songChanged) { P.songRev = ctx.song.rev || 0; P.parts = analyse(ctx.song.blocks); rebuildSheet(); toast("เนื้อเพลงนี้เพิ่งถูกแก้ไข แสดงฉบับล่าสุดแล้ว"); }
    else if (itemChanged) { rebuildSheet(); toast("ใช้ค่าล่าสุดของเพลงนี้ในงานแล้ว"); }
    refreshPlayerChrome();
    return;
  }
  stopPlay();
  P.key = key; P.ctx = ctx; P.parts = analyse(ctx.song.blocks);
  const st = settingsFrom(ctx); P.bpm = st.bpm; P.shift = st.shift; P.capo = st.capo;
  P.songRev = ctx.song.rev || 0; P.itemSig = itemSig(ctx.item);
  P.cur = 0; P.elapsed = 0; P.ended = false; P.paintedCur = P.paintedSec = -1;
  fontScale = prefs.get("font", 1);
  document.documentElement.style.setProperty("--scale", fontScale);
  document.body.classList.toggle("stage", !!prefs.get("stage", false));
  const s = ctx.song;

  const nameOf = it => { const x = it && Store.songs.get(it.songId); return x ? x.title : "เพลงถูกลบ"; };
  app.innerHTML = header({
    title: `${esc(s.title)}${s.artist ? `<small>${esc(s.artist)}</small>` : ""}`, back, sync: false,
    right: `${prev ? `<a class="icon-btn" href="#play-${ctx.event.id}-${prev.id}" aria-label="เพลงก่อนหน้า: ${esc(nameOf(prev))}">${ICON.prevSong}</a>` : ""}
      ${next ? `<a class="icon-btn" href="#play-${ctx.event.id}-${next.id}" aria-label="เพลงถัดไป: ${esc(nameOf(next))}">${ICON.nextSong}</a>` : ""}
      <button class="icon-btn" id="stage" type="button" aria-pressed="${!!prefs.get("stage", false)}" aria-label="โหมดเวที" title="โหมดเวที">${ICON.stage}</button>
`
  }) + `
  <div class="guide" aria-hidden="true"></div>
  <main class="wrap">
    <div class="song-head">
      <h1>${esc(s.title)}</h1>
      <div class="meta" id="pl-meta"></div>
      ${ctx.item && ctx.item.note ? `<div class="banner info" style="margin:6px 0 0"><span class="grow">${esc(ctx.item.note)}</span></div>` : ""}
      ${songStats(s).unclear ? `<div class="banner" style="margin:6px 0 0"><span class="grow">เพลงนี้ยังมี ${songStats(s).unclear} จุดที่อ่านไม่ชัด (สีเหลือง)${writable() ? ` · <a href="#edit-${s.id}">ตรวจแก้</a>` : ""}</span></div>` : ""}
    </div>
    <article class="sheet player-sheet" id="sheet"></article>
    <div class="next-song">
      ${prev ? `<a href="#play-${ctx.event.id}-${prev.id}">‹ ${esc(nameOf(prev))}</a>` : "<span></span>"}
      ${next ? `<a href="#play-${ctx.event.id}-${next.id}">${esc(nameOf(next))} ›</a>` : ""}
    </div>
    ${writable() ? `<p style="text-align:center"><a class="btn ghost" href="#edit-${s.id}">แก้เนื้อเพลง/คอร์ด</a></p>` : ""}
  </main>
  <div style="height:230px"></div>
  <section class="player" aria-label="ตัวควบคุมการเล่น"><div class="wrap">
    <div class="status" aria-live="polite"><span class="now-sec" id="now-sec"></span><span class="next-sec" id="next-sec"></span>
      <span class="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <div id="next-card"></div>
    <div class="prog"><span id="t-now">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="ตำแหน่งในเพลง"><span id="t-all">0:00</span></div>
    <div class="ctrls">

        <button id="capo-down" type="button" aria-label="ลดคาโป้">−</button><span class="val" id="capo"></span><button id="capo-up" type="button" aria-label="เพิ่มคาโป้">+</button></div>
      <div class="stepper" role="group" aria-label="ขนาดตัวหนังสือ" style="grid-template-columns:auto 34px 34px;gap:6px"><span class="cap" style="grid-column:auto">ตัวอักษร</span>
        <button id="fs-down" type="button" aria-label="ตัวหนังสือเล็กลง" style="font-size:14px">A−</button><button id="fs-up" type="button" aria-label="ตัวหนังสือใหญ่ขึ้น" style="font-size:14px">A+</button></div>
      <button class="btn ghost" type="button" id="reset" style="min-height:36px;padding:0 10px">คืนค่าเดิม</button>

  document.body.classList.add("player-on");

}
function rebuildSheet() {
  const keep = P.cur;
  $("#sheet").innerHTML = sheetHTML(P.parts, P.shift - P.capo);
  P.paintedCur = P.paintedSec = -1;
  measure();
  P.cur = Math.min(keep, Math.max(0, P.rows.length - 1));
  if (P.cur > 0) scrollToRow(P.cur, true);
  paint();
}
function refreshPlayerChrome() {
  const ctx = P.ctx; if (!ctx) return;
  const s = ctx.song;
  const key = keyOf(s.blocks, P.shift), shape = P.capo ? keyOf(s.blocks, P.shift - P.capo) : "";
  const meta = [];
  if (s.artist) meta.push(`<span class="hide-stage">${esc(s.artist)}</span>`);
  meta.push(`<span>คีย์ <b>${esc(key)}</b>${P.capo ? ` · คาโป้ ${P.capo} จับคอร์ด <b>${esc(shape)}</b>` : ""}</span>`);
  if (ctx.item && ctx.item.singer) meta.push(`<span>ร้อง: ${esc(ctx.item.singer)}</span>`);
  if (ctx.event) meta.push(`<span class="hide-stage">${esc(ctx.event.name)} · เพลงที่ ${ctx.index + 1}/${ctx.list.length}</span>`);
  meta.push(`<span class="hide-stage">ยาวประมาณ ${fmtTime(P.total)}</span>`);
  $("#pl-meta").innerHTML = meta.join("");
  $("#bpm").textContent = P.bpm;
  $("#tr").textContent = P.shift === 0 ? "เดิม" : (P.shift > 0 ? "+" : "") + P.shift;
  $("#capo").textContent = P.capo;
  const note = $("#saved-note");
  if (note) note.textContent = ctx.item ? (writable() ? "ค่าที่ปรับบันทึกไว้กับงานนี้" : "ดูอย่างเดียว: ค่าที่ปรับใช้ชั่วคราว") : "BPM บันทึกกับเพลง · คีย์/คาโป้จำไว้ในเครื่องนี้";
  refreshSyncPill();
}

/* ---------- saving player changes (one write per pause) ---------- */
function queueSave(patch) {
  const ctx = P.ctx; if (!ctx) return;
  if (!ctx.item) {
    const lib = prefs.get("lib:" + ctx.song.id, {});
    if ("shift" in patch) lib.shift = patch.shift;
    if ("capo" in patch) lib.capo = patch.capo;
    prefs.set("lib:" + ctx.song.id, lib);
    if ("bpm" in patch && writable()) { P.pendingSave = { ...(P.pendingSave || {}), bpm: patch.bpm }; }
  } else if (writable()) P.pendingSave = { ...(P.pendingSave || {}), ...patch };
  if (!P.pendingSave) return;
  clearTimeout(P.saveTimer);
  P.saveTimer = setTimeout(flushSave, 900);
}
async function flushSave() {
  const ctx = P.ctx, patch = P.pendingSave; P.pendingSave = null;
  if (!ctx || !patch) return;
  if (ctx.item) { P.itemSig = itemSig({ ...ctx.item, ...patch }); await patchItem(ctx.item.id, patch); }
  else if ("bpm" in patch) await patchSong(ctx.song.id, { bpm: patch.bpm });
}

/* ---------- timeline ---------- */
function measure() {
  P.rows = $$("#sheet .line");
  P.tops = P.rows.map(el => el.getBoundingClientRect().top + window.scrollY);
  retime();
}
const secPerBar = () => 4 * 60 / P.bpm;
function retime() {
  P.starts = []; let t = 0;
  P.rows.forEach(el => { P.starts.push(t); t += (+el.dataset.bars) * secPerBar(); });
  P.total = t;
  const all = $("#t-all"); if (all) all.textContent = fmtTime(P.total);
  paint();
}
const rowDur = k => P.rows[k] ? (+P.rows[k].dataset.bars) * secPerBar() : 0;
const guideY = () => window.innerHeight * 0.34;
function rowAtScroll() {

function makeBackup() {
  const strip = o => { const r = { ...o }; return r; };
  return {
    format: "chordscroll-backup", version: 1, exportedAt: new Date().toISOString(),
    songs: [...Store.songs.values()].map(strip), events: [...Store.events.values()].map(strip), items: [...Store.items.values()].map(strip)
  };
}
async function saveBackupFile() {
  const data = JSON.stringify(makeBackup(), null, 1);
  const name = `chordscroll-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast("บันทึกไฟล์แล้ว"); }
    catch (e) { toast(e && e.code === "declined" ? "ยกเลิกการดาวน์โหลด" : "ดาวน์โหลดไม่ได้ ใช้ “แสดงเป็นข้อความ” แทน"); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("เริ่มดาวน์โหลดแล้ว ถ้าไม่มีไฟล์ ใช้ “แสดงเป็นข้อความ” แทน");
  } catch (e) { toast("ดาวน์โหลดไม่ได้ ใช้ “แสดงเป็นข้อความ” แทน"); }
}

/** Check a backup before touching anything. Bad entries are listed and skipped, never half-written. */
function checkBackup(raw) {
  let data;
  try { data = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return { fatal: "ไม่ใช่ไฟล์ JSON ที่อ่านได้" }; }
  if (!data || data.format !== "chordscroll-backup") return { fatal: "ไม่ใช่ไฟล์สำรองของคอร์ดเลื่อนตามเพลง" };
  if (data.version !== 1) return { fatal: `ไฟล์สำรองรุ่น ${data.version} ยังไม่รองรับ` };
  const idOk = id => typeof id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,80}$/.test(id) && id !== "." && id !== "..";
  const problems = [];
  const songs = [], events = [], items = [];
  // ids of entries we skip: "replace all" must never delete what the file names but we could not read
  const skipped = { songs: new Set(), events: new Set(), items: new Set() };
  const skip = (c, x, msg) => { problems.push(msg); if (x && idOk(x.id)) skipped[c].add(x.id); };
  for (const s of Array.isArray(data.songs) ? data.songs : []) {
    if (!idOk(s.id) || typeof s.title !== "string" || !s.title.trim() || !Array.isArray(s.blocks)) { skip("songs", s, `ข้ามเพลงที่ข้อมูลไม่ครบ: ${String(s && s.title || s && s.id || "?").slice(0, 40)}`); continue; }
    if (s.bpm != null && !validBpm(s.bpm)) s.bpm = null;
    songs.push(s);
  }
  for (const e of Array.isArray(data.events) ? data.events : []) {
    if (!idOk(e.id) || typeof e.name !== "string" || !Array.isArray(e.sets) || !e.sets.every(x => x && idOk(x.id) && typeof x.name === "string")) { skip("events", e, `ข้ามงานที่ข้อมูลไม่ครบ: ${String(e && e.name || "?").slice(0, 40)}`); continue; }
    events.push(e);
  }
  const songIds = new Set([...songs.map(s => s.id), ...Store.songs.keys()]);
  const eventIds = new Set([...events.map(e => e.id), ...Store.events.keys()]);
  for (const it of Array.isArray(data.items) ? data.items : []) {
    const brk = it && it.kind === "break";
    if (!idOk(it.id) || !idOk(it.eventId) || (!brk && !idOk(it.songId)) || typeof it.order !== "number" || !isFinite(it.order)) { skip("items", it, "ข้ามรายการเพลงในเซ็ตที่ข้อมูลไม่ครบ"); continue; }
    if (!eventIds.has(it.eventId) || (!brk && !songIds.has(it.songId))) { skip("items", it, "ข้ามรายการที่อ้างถึงงานหรือเพลงที่ไม่มีในไฟล์"); continue; }
    if (brk) { if (!(Number(it.minutes) >= 0 && Number(it.minutes) <= 240)) it.minutes = 0; items.push(it); continue; }
    if (it.bpm != null && !validBpm(it.bpm)) it.bpm = null;
    if (it.capo != null && !(Number.isInteger(it.capo) && it.capo >= 0 && it.capo <= 11)) it.capo = Number.isInteger(it.capo) ? clamp(it.capo, 0, 11) : 0;
    if (it.shift != null && !(Number.isInteger(it.shift) && it.shift >= -6 && it.shift <= 6)) it.shift = Number.isInteger(it.shift) ? clamp(it.shift, -6, 6) : 0;
    if (it.durationSec != null && !validDur(it.durationSec)) it.durationSec = null;
    items.push(it);
  }
  return { songs, events, items, problems, skipped, exportedAt: data.exportedAt };
}
function previewRestore(raw) {
  const r = checkBackup(raw);
  if (r.fatal) { toast(r.fatal, 5000); return; }
  const over = c => r[c].filter(x => Store[c].has(x.id)).length;
  const extra = c => [...Store[c].keys()].filter(id => !r[c].some(x => x.id === id) && !r.skipped[c].has(id)).length;
  const admin = canReplaceAll();
  openDialog(`<h2>นำเข้าไฟล์สำรอง</h2>
    <p class="muted" style="margin:0">ไฟล์จาก ${esc(r.exportedAt ? fmtAgo(Date.parse(r.exportedAt)) : "ไม่ทราบเวลา")}: ${r.songs.length} เพลง · ${r.events.length} งาน · ${r.items.length} รายการในเซ็ต</p>
    ${r.problems.length ? `<ul class="issues">${[...new Set(r.problems)].slice(0, 8).map(p => `<li class="warn">${esc(p)}</li>`).join("")}</ul>` : ""}
    <div class="checks">
      <div><b>รวมกับข้อมูลเดิม</b><br><span class="small muted">เพิ่มรายการใหม่ และทับเฉพาะรายการที่มีในไฟล์ (${over("songs")} เพลง, ${over("events")} งาน จะถูกทับ) รายการอื่นที่มีอยู่ไม่ถูกแตะ</span></div>
      <div><b>แทนที่ทั้งหมด</b><br><span class="small muted">ข้อมูลจะเหมือนไฟล์ทุกอย่าง ลบ ${extra("songs")} เพลง, ${extra("events")} งาน, ${extra("items")} รายการที่ไม่มีในไฟล์${admin ? "" : " · ต้องเป็น Editor หรือเจ้าของ"}</span></div>
    </div>
    <label class="f" ${admin ? "" : "hidden"}><span>พิมพ์คำว่า แทนที่ เพื่อยืนยันแบบแทนที่ทั้งหมด</span><input id="rs-confirm" autocomplete="off"></label>
    <div class="actions"><button class="btn ghost" data-a="c" type="button">ยกเลิก</button>
      ${admin ? `<button class="btn danger" data-a="replace" type="button" disabled>แทนที่ทั้งหมด</button>` : ""}
      <button class="btn primary" data-a="merge" type="button">รวมกับข้อมูลเดิม</button></div>`, (el, d) => {
    const conf = $("#rs-confirm", el), rep = $('[data-a="replace"]', el);
    if (conf && rep) conf.addEventListener("input", () => { rep.disabled = conf.value.trim() !== "แทนที่"; });
    el.addEventListener("click", async e => {
      const a = (e.target.closest("[data-a]") || {}).dataset?.a; if (!a) return;
      d.close();
      if (a === "c") return;
      await applyRestore(r, a === "replace");
    });
  }, { label: "นำเข้าไฟล์สำรอง" });
}
async function applyRestore(r, replace, { quiet = false } = {}) {
  const out = quiet ? null : $("#rs-out");
  let done = 0, failed = 0, changed = 0;
  const total = r.songs.length + r.events.length + r.items.length;
  const same = (c, id, body) => { const cur = Store[c].get(id); if (!cur) return false; const { id: _, ...b } = cur; return JSON.stringify(sortKeys(b)) === JSON.stringify(sortKeys(body)); };
  const step = async (c, label, id, body) => {
    if (same(c, id, body)) { done++; return; }   // already identical: no write needed
    const ok = await track(label, () => Store.db.doc(c + "/" + id).set(body));
    if (ok) { done++; changed++; } else failed++;
    if (out) out.innerHTML = `<p class="progress"><span class="spinner"></span> นำเข้าแล้ว ${done}/${total}${failed ? ` · ไม่สำเร็จ ${failed}` : ""}</p>`;
  };
  for (const s of r.songs) { const { id, ...body } = s; await step("songs", "นำเข้าเพลง " + s.title, id, body); }
  for (const ev of r.events) { const { id, ...body } = ev; await step("events", "นำเข้างาน " + ev.name, id, body); }
  for (const it of r.items) { const { id, ...body } = it; await step("items", "นำเข้ารายการเพลง", id, body); }
  let removed = 0;
  if (replace && !failed) {
    const keep = { songs: new Set([...r.songs.map(x => x.id), ...r.skipped.songs]), events: new Set([...r.events.map(x => x.id), ...r.skipped.events]), items: new Set([...r.items.map(x => x.id), ...r.skipped.items]) };
    for (const c of ["items", "events", "songs"]) for (const id of [...Store[c].keys()]) if (!keep[c].has(id)) {
      if (await track("ลบรายการที่ไม่มีในไฟล์", () => Store.db.doc(c + "/" + id).delete())) removed++; else failed++;
    }
  }
  const msg = failed ? `นำเข้าได้ ${done}/${total} รายการ ไม่สำเร็จ ${failed} (ดูที่ปุ่มสถานะเพื่อลองใหม่)${replace ? " · ยังไม่ได้ลบรายการเดิม เพราะนำเข้าไม่ครบ" : ""}`
    : `นำเข้าครบ ${done} รายการ${replace ? ` · ลบรายการที่ไม่มีในไฟล์ ${removed} รายการ` : ""}`;
  if (out) out.innerHTML = `<div class="banner ${failed ? "bad" : "info"}"><span class="grow">${esc(msg)}</span></div>`;
  if (!quiet) toast(msg, 6000);
  return { done, failed, changed, removed };
}
function sortKeys(o) {
  if (Array.isArray(o)) return o.map(sortKeys);
  if (o && typeof o === "object") return Object.keys(o).sort().reduce((a, k) => (a[k] = sortKeys(o[k]), a), {});
  return o;
}

async function drawTrash() {
  const box = $("#trash"); if (!box) return;
  const list = await trashList();
  if (!$("#trash")) return;
  if (!list) { box.innerHTML = `<p class="small muted">โหลดถังขยะไม่ได้</p>`; return; }
  box.innerHTML = list.length ? `<div class="history-list">${list.map(h => `<div class="h"><span><b>${esc(h.title || "ไม่มีชื่อ")}</b> <span class="small muted">${h.kind === "song" ? "เพลง" : "งาน"} · ลบ ${esc(fmtAgo(h.at))}${h.extra && h.extra.items && h.extra.items.length ? ` · ${h.extra.items.length} รายการในเซ็ต` : ""}</span></span>
    <span class="row">${writable() ? `<button class="btn" type="button" data-untrash="${esc(h.id)}">กู้คืน</button>` : ""}${canReplaceAll() ? `<button class="btn ghost" type="button" data-purge="${esc(h.id)}">ลบถาวร</button>` : ""}</span></div>`).join("")}</div>`
    : `<p class="small muted">ถังขยะว่าง</p>`;
  box.onclick = async e => {
    const u = e.target.closest("[data-untrash]"), p = e.target.closest("[data-purge]");
    const h = list.find(x => x.id === (u || p || {}).dataset?.untrash || x.id === (p || {}).dataset?.purge);
    if (u && h) { if (await restoreHistory(h)) toast(`กู้ “${h.title}” แล้ว`); drawTrash(); }
    if (p && h && await confirmDialog(`ลบ “${h.title}” ถาวร?`, "ลบประวัติทั้งหมดของรายการนี้ กู้คืนไม่ได้อีก", "ลบถาวร", true)) { await purgeHistory(h); drawTrash(); }
  };
}

/* ---------- getting a gig ready to play without internet ----------
   Works on the public link (https). The app itself is cached by a service worker (sw.js) and every
   page load keeps it fresh; "เตรียมเล่นออฟไลน์" also copies the gig, its sets and every song into this
   browser and records what was copied, so the page can say plainly whether the gig is ready offline. */
const OFFLINE_CACHE = "chordscroll-app";
const offlineCapable = () => location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
const swCapable = () => offlineCapable() && "serviceWorker" in navigator && "caches" in window && !(window.claude && Store.mode === "shared");
let swReg = null;
async function registerSW() {
  if (!swCapable()) return null;
  try { swReg = await navigator.serviceWorker.register("sw.js"); return swReg; } catch (e) { return null; }
}
function eventStamp(eventId) {
  const ev = Store.events.get(eventId); if (!ev) return 0;
  let t = ev.updatedAt || 0;
  for (const it of eventItems(eventId)) {
    t = Math.max(t, it.updatedAt || 0);
    const s = !isBreak(it) && Store.songs.get(it.songId); if (s) t = Math.max(t, s.updatedAt || 0);
  }
  return t;
}
/** Synchronous answer for the readiness check: {ready, text}. */
function offlineStatus(eventId) {
  if (!swCapable()) return null;   // not offered here (claude.ai frame, file://)
  const meta = prefs.get("offline:" + eventId, null);
  if (!meta) return { ready: false, text: "ยังไม่ได้เตรียมงานนี้สำหรับเล่นออฟไลน์" };
  if (eventStamp(eventId) > meta.stamp) return { ready: false, text: "มีการแก้ไขหลังเตรียมออฟไลน์ครั้งล่าสุด กดเตรียมใหม่" };
  return { ready: true, text: `พร้อมเล่นออฟไลน์ · แอป ✓ · ${meta.songs} เพลง ✓ · เตรียมเมื่อ ${fmtAgo(meta.at)}` };
}
async function prepareOffline(eventId) {
  if (!swCapable()) {
    toast(Store.mode === "shared" ? "หน้านี้บน claude.ai เก็บไว้ใช้ออฟไลน์ไม่ได้ ใช้ลิงก์ github.io แทน" : "เปิดผ่านลิงก์ https (github.io) เพื่อเตรียมเล่นออฟไลน์", 6000);
    return false;
  }
  const ev = Store.events.get(eventId); if (!ev) return false;
  toast("กำลังเตรียมงานสำหรับเล่นออฟไลน์…", 10000);
  try {
    const reg = swReg || await registerSW();
    if (!reg) throw new Error("service worker");
    const cache = await caches.open(OFFLINE_CACHE);
    await cache.add(new Request("./", { cache: "reload" }));
    // fonts are optional: the page falls back to system Thai fonts if they are missing
    const fontLink = $('link[href*="fonts.googleapis.com/css2"]');
    if (fontLink) { try { await cache.add(new Request(fontLink.href, { mode: "no-cors" })); } catch (e) { /* fonts optional */ } }
    const items = eventItems(eventId);
    const songs = items.filter(i => !isBreak(i)).map(i => Store.songs.get(i.songId)).filter(Boolean);
    const missing = items.filter(i => !isBreak(i) && !Store.songs.has(i.songId)).length;
    const pack = { event: ev, items, songs, at: now() };
    localStorage.setItem("chordscroll-offline-pack:" + eventId, JSON.stringify(pack));
    const appOk = !!(await cache.match("./"));
    if (!appOk) throw new Error("app not cached");
    prefs.set("offline:" + eventId, { at: now(), stamp: eventStamp(eventId), songs: songs.length });
    toast(missing ? `เตรียมแล้ว แต่มี ${missing} เพลงที่ถูกลบจากคลัง` : `พร้อมเล่นออฟไลน์แล้ว: แอปและ ${songs.length} เพลงอยู่ในเครื่องนี้`, 6000);
    notify("offline");
    return true;
  } catch (e) {
    toast("เตรียมออฟไลน์ไม่สำเร็จ: " + (/quota/i.test(String(e && e.name)) ? "พื้นที่เครื่องเต็ม" : "ลองใหม่ขณะมีเน็ต"), 6000);
    return false;
  }
}
/** Packs saved for offline use, for a store that cannot reach its server (used by the Supabase connector). */
function offlinePacks() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("chordscroll-offline-pack:")) out.push(JSON.parse(localStorage.getItem(k)));
    }
  } catch (e) { /* storage blocked */ }
  return out;
}
registerSW();

/* ---------- the band's published copy (public link, no accounts needed) ----------
   band-data.json sits next to the app on GitHub Pages. Every device that opens the link loads it and
   brings its songs and gigs up to date, so everyone sees the same gigs and songs on every device.
   Whoever prepares the gigs publishes a new copy from “แชร์และสำรอง” (download or copy, then upload to
   GitHub). What the band removes from the published copy is removed on every device; what a member made
   only on their own device stays theirs. Before an update replaces a song someone changed on their own
   device, their version goes into the song's history, so nothing is lost. */
const PUBLISH = typeof PUBLISH_CONFIG !== "undefined" ? PUBLISH_CONFIG : null;   // {repo, branch, path}
const PUB_FILE = "band-data.json";
const Published = { at: null, songs: 0, events: 0, error: null, lastCheck: 0, lastResult: null };
const META_KEYS = new Set(["rev", "createdAt", "updatedAt", "updatedBy", "setsRev", "id"]);
// rows of the first starter gig (ITD, now “เบรค 2”) as devices got them before the band's lists were
// rearranged; a device that never took a published copy still has them and the new copy replaces them
const STARTER_V1_ROWS = ["i95fcff2a582", "ifafc2909efa", "i987da13d3ca", "ifbc0ca79ab6", "i54bbfc02e32", "i5eeaae54954",
  "i650deff0208", "i890a913438a", "id13f10e88e8", "i8332cb86b39", "idd9759041cd", "i734a00f1b79"];
const contentKey = o => JSON.stringify(sortKeys(Object.fromEntries(Object.entries(o || {}).filter(([k]) => !META_KEYS.has(k)))));
const publishedOn = () => Store.mode === "device" && /^https?:$/.test(location.protocol);

async function syncPublished({ force = false } = {}) {
  if (!publishedOn()) return null;
  Published.lastCheck = now();
  let data;
  try {
    const res = await fetch(PUB_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (res.status === 404) { Published.error = null; Published.at = null; return null; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    Published.error = navigator.onLine ? "โหลดฉบับของวงไม่ได้" : null;   // offline: just use what this device has
    return null;
  }
  const r = checkBackup(data);
  if (r.fatal) { Published.error = "ไฟล์ฉบับของวงเสีย: " + r.fatal; return null; }
  Published.at = data.exportedAt; Published.songs = r.songs.length; Published.events = r.events.length; Published.error = null;
  const seen = prefs.get("pub:seen", null);
  if (!force && seen && seen.at === data.exportedAt) return (Published.lastResult = { unchanged: true });

  // only write what really differs (timestamps alone don't count)
  const differs = c => x => { const cur = Store[c].get(x.id); return !cur || contentKey(cur) !== contentKey(x); };
  const todo = { ...r, songs: r.songs.filter(differs("songs")), events: r.events.filter(differs("events")), items: r.items.filter(differs("items")) };
  let kept = 0;
  for (const s of todo.songs) { const cur = Store.songs.get(s.id); if (cur) { await keepHistory("song", s.id, cur, "edit"); kept++; } }
  const res = await applyRestore(todo, false, { quiet: true });

  // removed by the band since the last copy this device took
  const prev = (seen && seen.ids) || { songs: [], events: [], items: STARTER_V1_ROWS };
  const nowIds = { songs: new Set(r.songs.map(x => x.id)), events: new Set(r.events.map(x => x.id)), items: new Set(r.items.map(x => x.id)) };
  let removed = 0;
  for (const c of ["items", "events", "songs"]) for (const id of prev[c] || []) {
    if (nowIds[c].has(id) || !Store[c].has(id)) continue;
    if (c === "songs") await keepHistory("song", id, Store.songs.get(id), "delete", { items: [] });
    if (c === "events") await keepHistory("event", id, Store.events.get(id), "delete", { items: [] });
    if (await track("ลบตามฉบับของวง", () => Store.db.doc(c + "/" + id).delete())) removed++;
  }
  if (!res.failed) prefs.set("pub:seen", { at: data.exportedAt, ids: { songs: [...nowIds.songs], events: [...nowIds.events], items: [...nowIds.items] } });
  const changed = res.changed + removed;
  if (changed) toast(`อัปเดตตามฉบับของวงแล้ว (เผยแพร่ ${fmtAgo(Date.parse(data.exportedAt))})${kept ? ` · เก็บฉบับเดิมของ ${kept} เพลงไว้ในประวัติ` : ""}`, 7000);
  notify("published");
  return (Published.lastResult = { changed, removed, kept, failed: res.failed });
}
window.addEventListener("online", () => syncPublished());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && now() - Published.lastCheck > 5 * 60 * 1000) syncPublished();
});

/* ---------- routing ----------
   #                      gigs           #library        song library     #data   members & backup
   #event-<id>            one gig        #play-<event>-<item>  play a song inside a gig
   #song-<id>             play from the library   #edit-<id>  edit a song   #new-image / #new-text  add a song
   #s<set>-<n>            old links from the first version → the same song in the starter gig */
let currentRoute = null, prevHash = location.hash, ignoreHash = false;
function parseRoute(h) {
  const m = /^#?([a-z]+)(?:-([A-Za-z0-9]+))?(?:-([A-Za-z0-9]+))?$/.exec(h || "");
  if (!h || h === "#") return { name: "home" };
  const legacy = /^#s(\d+)-(\d+)$/.exec(h);
  if (legacy) return { name: "legacy", a: +legacy[1], b: +legacy[2] };
  if (!m) return { name: "home" };
  return { name: m[1], a: m[2], b: m[3] };
}
function route() {
  const r = parseRoute(location.hash);
  const same = currentRoute && currentRoute.name === r.name && currentRoute.a === r.a && currentRoute.b === r.b;
  if (currentRoute && !same) {
    if (currentRoute.name === "play" || currentRoute.name === "song") leavePlayer();
    if (["edit", "new"].includes(currentRoute.name)) closeEditor();
  }
  currentRoute = r;
  switch (r.name) {
    case "library": return renderLibrary();
    case "data": return renderData();
    case "event": return renderEvent(r.a);
    case "play": return renderPlayer("event", r.a, r.b);
    case "song": return renderPlayer("song", r.a);
    case "edit": return renderEditor("edit", r.a);
    case "new": return renderEditor(r.a === "image" ? "image" : "text");
    case "legacy": {
      // the first version had one set (ITD, now “เบรค 2”); old links point into it by position
      const LEGACY = ["e9adc0d877e2"];
      const ev = BUILTIN.events.find(e => e.id === LEGACY[r.a - 1]) || BUILTIN.events[r.a - 1];
      const it = ev && Store.events.has(ev.id) && eventItems(ev.id).filter(i => !isBreak(i))[r.b - 1];
      if (it) { location.replace("#play-" + ev.id + "-" + it.id); return; }
      if (!Store.fresh && Store.mode !== "device") { app.innerHTML = header({ title: "คอร์ดเลื่อนตามเพลง" }) + `<main class="wrap"><p class="empty">กำลังโหลด…</p></main>`; return; }
      location.replace("#"); return;
    }
    default: return renderHome();
  }
}
window.addEventListener("hashchange", async () => {
  if (ignoreHash) { ignoreHash = false; return; }
  const leavingEditor = currentRoute && ["edit", "new"].includes(currentRoute.name) && dirtyGuard;
  if (leavingEditor) {
    const target = location.hash;
    ignoreHash = true; location.hash = prevHash;   // stay until the person decides
    if (!(await confirmDialog("ออกโดยไม่บันทึก?", "สิ่งที่แก้ในเพลงนี้ยังไม่ได้บันทึก ถ้าออกตอนนี้จะหายไป", "ออกโดยไม่บันทึก", true))) return;
    closeEditor();
    ignoreHash = false; location.hash = target; prevHash = target;
    return;
  }
  prevHash = location.hash;
  route();
});

/* data changed: redraw what is on screen without losing typing or position */
let redrawQueued = false, lastWhat = new Set();
Store.listeners.add(what => {
  lastWhat.add(what);
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => {
    redrawQueued = false;
    const whats = lastWhat; lastWhat = new Set();
    refreshSyncPill();
    if (whats.size === 1 && whats.has("sync")) {
      const banner = $("main .banner"); // the "can't reach the database" note may need to appear or go
      if (currentRoute && ["home", "library", "event"].includes(currentRoute.name) && (Store.slow || banner)) route();
      return;
    }
    const r = currentRoute || { name: "home" };
    if (r.name === "home" && $("#home-list")) return renderHomeList();
    if (r.name === "library" && $("#lib-list")) return renderLibList();
    if (r.name === "data") return; // holds file inputs; counts refresh on next visit
    if (r.name === "edit" || r.name === "new") {
      if (!ed) return route();
      if (ed.mode === "edit") {
        const s = Store.songs.get(ed.id);
        if (s && (s.rev || 0) !== ed.baseRev && !ed.remoteChanged) { ed.remoteChanged = true; showRemoteNote(); }
      }
      return;
    }
    route();
  });
});
